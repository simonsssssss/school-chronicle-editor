  function insertPendingFamilySpan(box, range) {
    const node = range.startContainer;
    const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    let span = el && el.closest("span.ff");
    if (span && box.contains(span)
        && span.textContent.replace(/\u200B/g, "") === "" && !span.querySelector("br")) {
      if (!span.textContent) span.appendChild(document.createTextNode(ZWSP));
      return span;
    }
    removePendingSpans(box, node); // keep a pending size/bold/italic at the caret
    span = document.createElement("span");
    span.className = "ff";
    span.appendChild(document.createTextNode(ZWSP));
    range.insertNode(span);
    return span;
  }

  // Set the font (a CSS font-family value) at the current selection.
  // Selection: only the selected text gets the font. Caret only: the
  // font applies to the text typed next. Returns the span that got the font.
  function setFontFamily(box, css) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return null;
    const range = sel.getRangeAt(0);
    if (!box.contains(range.commonAncestorContainer)) return null;

    if (range.collapsed) {
      const span = insertPendingFamilySpan(box, range);
      span.style.fontFamily = css;

      // Caret into the innermost text of the span.
      const walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT);
      let lastText = null;
      while (walker.nextNode()) lastText = walker.currentNode;
      const r = document.createRange();
      if (lastText) r.setStart(lastText, lastText.length);
      else r.setStart(span, span.childNodes.length);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      return span;
    }

    let span;
    const sc = range.startContainer;
    if (sc === range.endContainer
        && sc.nodeType === Node.ELEMENT_NODE
        && sc.classList.contains("ff")
        && range.startOffset === 0
        && range.endOffset === sc.childNodes.length) {
      span = sc;
    } else {
      const frag = range.extractContents();
      frag.querySelectorAll("[style]").forEach((el) => { el.style.fontFamily = ""; });
      frag.querySelectorAll("span.ff").forEach((s) => s.replaceWith(...s.childNodes));

      span = document.createElement("span");
      span.className = "ff";
      span.appendChild(frag);
      range.insertNode(span);

      box.querySelectorAll("span.ff").forEach((s) => {
        if (s !== span && !s.textContent && !s.querySelector("br")) s.remove();
      });
    }
    span.style.fontFamily = css;

    const r = document.createRange();
    r.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(r);
    return span;
  }

  // ---- Font color ------------------------------------------------------------

  // Put an empty color span at the caret (or reuse the one the caret is
  // already in) and return it. Text typed next goes into this span.
  function insertPendingColorSpan(box, range) {
    const node = range.startContainer;
    const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    let span = el && el.closest("span.fc");
    if (span && box.contains(span)
        && span.textContent.replace(/\u200B/g, "") === "" && !span.querySelector("br")) {
      if (!span.textContent) span.appendChild(document.createTextNode(ZWSP));
      return span;
    }
    removePendingSpans(box, node); // keep a pending size/font/bold/italic at the caret
    span = document.createElement("span");
    span.className = "fc";
    span.appendChild(document.createTextNode(ZWSP));
    range.insertNode(span);
    return span;
  }

  // Set the text color at the current selection. Selection: only the
  // selected text changes color. Caret only: the color applies to the
  // text typed next.
  function setFontColor(box, color) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (!box.contains(range.commonAncestorContainer)) return;

    if (range.collapsed) {
      const span = insertPendingColorSpan(box, range);
      span.style.color = color;

      const walker = document.createTreeWalker(span, NodeFilter.SHOW_TEXT);
      let lastText = null;
      while (walker.nextNode()) lastText = walker.currentNode;
      const r = document.createRange();
      if (lastText) r.setStart(lastText, lastText.length);
      else r.setStart(span, span.childNodes.length);
      r.collapse(true);
      sel.removeAllRanges();
      sel.addRange(r);
      return;
    }

    let span;
    const sc = range.startContainer;
    if (sc === range.endContainer
        && sc.nodeType === Node.ELEMENT_NODE
        && sc.classList.contains("fc")
        && range.startOffset === 0
        && range.endOffset === sc.childNodes.length) {
      span = sc;
    } else {
      const frag = range.extractContents();
      frag.querySelectorAll("[style]").forEach((el) => { el.style.color = ""; });
      frag.querySelectorAll("span.fc").forEach((s) => s.replaceWith(...s.childNodes));

      span = document.createElement("span");
      span.className = "fc";
      span.appendChild(frag);
      range.insertNode(span);

      box.querySelectorAll("span.fc").forEach((s) => {
        if (s !== span && !s.textContent && !s.querySelector("br")) s.remove();
      });
    }
    span.style.color = color;

    const r = document.createRange();
    r.selectNodeContents(span);
    sel.removeAllRanges();
    sel.addRange(r);
  }

  // The visible pieces of text inside a selection. Zero-width spaces and
  // text the selection only touches at its very edge don't count.
  function textNodesInRange(r) {
    const ok = (t) => {
      if (t.data.replace(/\u200B/g, "") === "") return false;
      if (t === r.startContainer && r.startOffset >= t.length) return false;
      if (t === r.endContainer && r.endOffset === 0) return false;
      return true;
    };
    const root = r.commonAncestorContainer;
    if (root.nodeType === Node.TEXT_NODE) return ok(root) ? [root] : [];
    const out = [];
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const t = walker.currentNode;
      if (r.intersectsNode(t) && ok(t)) out.push(t);
    }
    return out;
  }

  // Light up the bold/italic buttons of a box, and show the font and color
  // of the text in the list and the color bar. Caret: the text at the caret.
  // Selection: B / I are on only when ALL selected text is bold / italic
  // (same rule the buttons use when clicked); font and color come from the
  // first selected piece of text.
  function updateFormatButtons(box) {
    const wrapper = box && box.parentElement;
    if (!wrapper) return;
    const sel = window.getSelection();
    let node = null;
    let texts = [];
    if (sel.rangeCount > 0 && box.contains(sel.anchorNode)) {
      const r = sel.getRangeAt(0);
      if (!r.collapsed) texts = textNodesInRange(r);
      if (texts.length) {
        node = texts[0];
      } else {
        node = r.startContainer;
        if (node.nodeType === Node.ELEMENT_NODE) {
          const kids = node.childNodes, o = r.startOffset;
          node = (r.collapsed ? (kids[o - 1] || kids[o]) : (kids[o] || kids[o - 1])) || node;
        }
      }
    }
    ["bold", "italic"].forEach((cmd) => {
      const btn = wrapper.querySelector(`.format-btn[data-cmd="${cmd}"]`);
      if (!btn) return;
      const on = texts.length
        ? texts.every((t) => formatAncestor(t, box, cmd))
        : !!node && !!formatAncestor(node, box, cmd);
      btn.classList.toggle("on", on);
    });

    // Font list: show the font of the text at the caret / selection start.
    const fam = wrapper.querySelector(".font-family-control");
    if (fam && node) {
      const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      if (el) {
        const f = fontAt(el);
        fam.value = f.name;
        fam.style.fontFamily = f.css;
      }
    }
    // Color button: the bar under the "A" shows the color at the caret.
    const bar = wrapper.querySelector(".format-color-bar");
    if (bar && node) {
      const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
      if (el) bar.style.background = colorAt(el);
    }
  }

  // ---- Copy / cut / paste / drag and drop inside text boxes -------------------

  // Private clipboard/drag format. Only content taken from the app's own text
  // boxes carries it, so only that keeps its bold / italics / sizes / fonts.
  const CLIP_TYPE = "application/x-kronika-html";

  // The selected part of a text box: its box, range, formatted HTML (wrapped
  // in the formatting it sits inside) and plain text. null if not in a box.
  function selectionInfo(sel) {
    if (!sel.rangeCount || sel.isCollapsed) return null;
    const range = sel.getRangeAt(0);
    const node = range.commonAncestorContainer;
    const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
    const box = el && el.closest(".textbox");
    if (!box) return null;

    let content = range.cloneContents();
    for (let a = el; a && a !== box; a = a.parentElement) {
      const wrap = a.cloneNode(false);
      wrap.appendChild(content);
      content = wrap;
    }
    const holder = document.createElement("div");
    holder.appendChild(content);
    return {
      box,
      range,
      html: holder.innerHTML.replace(/\u200B/g, ""),
      text: sel.toString().replace(/\u200B/g, "")
    };
  }

  function htmlFragment(html) {
    const t = document.createElement("template");
    t.innerHTML = html;
    return t.content;
  }

  // Plain text as content for a text box (line breaks become <br>).
  // null if there is no text at all.
  function plainTextFragment(text) {
    text = (text || "").replace(/\r\n?/g, "\n").replace(/\u200B/g, "");
    if (!text) return null;
    const frag = document.createDocumentFragment();
    text.split("\n").forEach((line, i) => {
      if (i > 0) frag.appendChild(document.createElement("br"));
      if (line) frag.appendChild(document.createTextNode(line));
    });
    return frag;
  }

  // Copy or cut inside a text box: plain text on the clipboard (for other
  // programs and for plain pastes) plus the formatted version in the
  // private format (for pastes back into the app).
  function onCopyOrCut(e) {
    const info = selectionInfo(window.getSelection());
    if (!info) return; // not in a text box (e.g. the font-size input): normal copy

    e.preventDefault();
    e.clipboardData.setData("text/plain", info.text);
    e.clipboardData.setData("text/html", info.html); // formatting survives in Word etc.
    e.clipboardData.setData(CLIP_TYPE, info.html);

    // Cut: we took over the clipboard, so remove the text ourselves.
    if (e.type === "cut" && info.box.isContentEditable) {
      const sel = window.getSelection();
      const first = firstDeletedText(info.range);
      const chain = first ? formatChain(first, info.box) : [];
      info.range.deleteContents();
      sel.removeAllRanges();
      sel.addRange(info.range);
      keepFormatAfterDelete(info.box, chain);   // keep the font/size/color for what's typed next
      keepAnchored(info.box);                   // pole przypięte do kropki: wyśrodkuj po wycięciu
      updateFormatButtons(info.box);
    }
  }
  document.addEventListener("copy", onCopyOrCut);
  document.addEventListener("cut", onCopyOrCut);

  // Put a piece of content at the caret (replacing any selection), leave the
  // caret after it, and undo everything if it would stick out below the page.
  // Returns false if it had to be undone.
  function insertAtCaret(box, frag) {
    if (!frag) return true;
    const sel = window.getSelection();
    if (!sel.rangeCount) return true;
    const range = sel.getRangeAt(0);
    if (!box.contains(range.commonAncestorContainer)) return true;
    const last = frag.lastChild;
    if (!last) return true;

    const snap = takeSnapshot(box);
    range.deleteContents();
    range.insertNode(frag);

    // A <br> at the very end doesn't create a visible line: add a
    // placeholder <br> for the caret to sit on (same as with Enter).
    if (last.nodeName === "BR" && nothingAfter(box, last)) {
      box.appendChild(document.createElement("br"));
    }

    const caret = document.createRange();
    if (last.nodeType === Node.TEXT_NODE) caret.setStart(last, last.length);
    else caret.setStartAfter(last);
    caret.collapse(true);
    sel.removeAllRanges();
    sel.addRange(caret);

    const fits = fitsInPage(box);
    if (!fits) restoreSnapshot(box, snap);
    stripZwsp(box);
    updateFormatButtons(box);
    return fits;
  }

  // Paste into a text box: formatted only if it was copied from the app's
  // own text boxes, plain text otherwise.
  function pasteIntoBox(box, e) {
    e.preventDefault(); // never let the browser paste outside formatting
    const cd = e.clipboardData;
    if (!cd) return;
    const internal = cd.getData(CLIP_TYPE);
    insertAtCaret(box, internal ? htmlFragment(internal) : plainTextFragment(cd.getData("text/plain")));
  }

  // Text being dragged out of one of our text boxes (null otherwise).
  let dragSource = null;

  document.addEventListener("dragstart", (e) => {
    dragSource = null;
    const info = selectionInfo(window.getSelection());
    if (!info || !info.box.isContentEditable || !e.dataTransfer) return;
    e.dataTransfer.setData(CLIP_TYPE, info.html);
    dragSource = { box: info.box, range: info.range.cloneRange() };
  });
  document.addEventListener("dragend", () => { dragSource = null; });

  // The editable text box an event happened in, or null.
  function editableBoxAt(target) {
    const el = target && (target.nodeType === Node.ELEMENT_NODE ? target : target.parentElement);
    const box = el && el.closest(".textbox");
    return box && box.isContentEditable ? box : null;
  }

  function caretRangeAt(x, y) {
    if (document.caretRangeFromPoint) return document.caretRangeFromPoint(x, y);
    if (document.caretPositionFromPoint) {
      const p = document.caretPositionFromPoint(x, y);
      if (!p) return null;
      const r = document.createRange();
      r.setStart(p.offsetNode, p.offset);
      r.collapse(true);
      return r;
    }
    return null;
  }

  // Drop onto a text box. Text dragged from our own boxes is moved with its
  // formatting; text from other programs arrives as plain text.
  function dropIntoBox(box, e) {
    const pos = caretRangeAt(e.clientX, e.clientY);
    if (!pos || !box.contains(pos.startContainer)) return;

    const src = dragSource;
    dragSource = null;
    const internal = src ? e.dataTransfer.getData(CLIP_TYPE) : "";

    const placeCaret = () => {
      box.focus({ preventScroll: true });
      const sel = window.getSelection();
      sel.removeAllRanges();
      sel.addRange(pos);
    };

    if (src && internal) {
      // Dropped onto the dragged text itself: nothing to do.
      if (src.range.isPointInRange(pos.startContainer, pos.startOffset)) return;

      const snapTarget = takeSnapshot(box);
      const snapSource = src.box !== box ? takeSnapshot(src.box) : null;
      src.range.deleteContents();   // `pos` adjusts itself to the change
      placeCaret();
      if (!insertAtCaret(box, htmlFragment(internal))) {
        // Doesn't fit on the page: put both boxes back as they were.
        restoreSnapshot(box, snapTarget);
        if (snapSource) restoreSnapshot(src.box, snapSource);
      } else if (src.box !== box) {
        keepAnchored(src.box);   // tekst wyszedł z tego pola: wyśrodkuj je znowu
      }
      return;
    }

    const frag = plainTextFragment(e.dataTransfer.getData("text/plain"));
    if (!frag) return; // files, images...: nothing
    placeCaret();
    insertAtCaret(box, frag);
  }

  // The browser must never handle a drop itself: a dropped file would
  // replace the whole chronicle. Only text boxes accept drops, and we
  // insert the text ourselves.
  window.addEventListener("dragover", (e) => {
    e.preventDefault();
    if (e.dataTransfer && !editableBoxAt(e.target)) e.dataTransfer.dropEffect = "none";
  });
  window.addEventListener("drop", (e) => {
    e.preventDefault();
    const box = editableBoxAt(e.target);
    if (box && e.dataTransfer) dropIntoBox(box, e);
    dragSource = null;
  });

  // True if nothing with content comes after `node` inside `box`.
  function nothingAfter(box, node) {
    for (let n = node; n && n !== box; n = n.parentNode) {
      for (let s = n.nextSibling; s; s = s.nextSibling) {
        if (s.nodeType !== Node.TEXT_NODE || s.textContent.length > 0) return false;
      }
    }
    return true;
  }

  // Insert a single line break at the caret instead of Chrome's default
  // <div> markup, which leaves extra space at the bottom of the box.
  function insertLineBreak(box) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return;
    const range = sel.getRangeAt(0);
    if (!box.contains(range.commonAncestorContainer)) return;

    const snap = takeSnapshot(box); // so the Enter can be undone if it overflows

    range.deleteContents(); // Enter over a selection replaces it

    const br = document.createElement("br");
    range.insertNode(br);

    // Invisible character right after the line break, INSIDE the same
    // size / font / bold / italic / color elements. The caret goes into it,
    // so whatever is typed on the new line keeps all that formatting.
    // stripZwsp removes it as soon as real text is typed.
    const holder = document.createTextNode(ZWSP);
    br.parentNode.insertBefore(holder, br.nextSibling);

    // A <br> at the very end doesn't create a visible line, so add a
    // placeholder <br>. It goes right after the invisible character, inside
    // the same formatting, so the empty line stays formatted even after the
    // caret leaves and comes back.
    if (nothingAfter(box, holder)) {
      holder.parentNode.insertBefore(document.createElement("br"), holder.nextSibling);
    }

    const caret = document.createRange();
    caret.setStart(holder, 1);
    caret.collapse(true);
    sel.removeAllRanges();
    sel.addRange(caret);

    // The new line would stick out below the page: undo it.
    if (!fitsInPage(box)) restoreSnapshot(box, snap);
  }

  // Backspace / Delete: first silently remove invisible characters next to
  // the caret, so a single key press always deletes something visible.
  function skipZwspAtCaret(box, backward) {
    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    const r = sel.getRangeAt(0);
    const t = r.startContainer;
    if (t.nodeType !== Node.TEXT_NODE || !box.contains(t)) return;

    let o = r.startOffset;
    if (backward) {
      while (o > 0 && t.data[o - 1] === ZWSP) { t.deleteData(o - 1, 1); o--; }
    } else {
      while (o < t.length && t.data[o] === ZWSP) t.deleteData(o, 1);
    }

    const c = document.createRange();
    c.setStart(t, o);
    c.collapse(true);
    sel.removeAllRanges();
    sel.addRange(c);
  }

  // ---- Keep formatting when its text is deleted ----------------------------

  // Formatting elements (size, font, color, bold, italic) around `node`,
  // innermost first, inside the box.
  function formatChain(node, box) {
    const chain = [];
    let n = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentNode);
    for (; n && n !== box; n = n.parentNode) {
      if (n.nodeType === Node.ELEMENT_NODE && n.matches(PENDING_SELECTOR)) chain.push(n);
    }
    return chain;
  }

  // The first text node that actually loses characters to `range`.
  function firstDeletedText(range) {
    const sc = range.startContainer;
    if (sc.nodeType === Node.TEXT_NODE && range.startOffset < sc.length) return sc;
    const root = range.commonAncestorContainer;
    if (root.nodeType === Node.TEXT_NODE) return root;
    const walker = document.createTreeWalker(root, NodeFilter.SHOW_TEXT);
    while (walker.nextNode()) {
      const t = walker.currentNode;
      if (t === sc && range.startOffset >= t.length) continue; // only touches its end
      if (range.intersectsNode(t) && t.data.replace(/\u200B/g, "") !== "") return t;
    }
    return null;
  }

  // Before a delete: the formatting of the text that is about to go.
  function chainBeingDeleted(box, e) {
    const targets = e.getTargetRanges ? e.getTargetRanges() : [];
    if (targets.length) {
      const sr = targets[0];
      const r = document.createRange();
      r.setStart(sr.startContainer, sr.startOffset);
      r.setEnd(sr.endContainer, sr.endOffset);
      const t = firstDeletedText(r);
      if (t && box.contains(t)) return formatChain(t, box);
    }
    const sel = window.getSelection();
    return sel.rangeCount ? formatChain(sel.anchorNode, box) : [];
  }

  // After a delete: if the text of a size / font / color / bold / italic
  // element was deleted completely, the browser (or removePendingSpans)
  // throws the element away. Put an empty copy back at the caret, so the
  // text typed next keeps that formatting, like in Word.
  function keepFormatAfterDelete(box, chain) {
    if (!chain || !chain.length) return;

    const hasText = (el) => el.textContent.replace(/\u200B/g, "") !== "" || !!el.querySelector("br");
    const inner = chain[0];
    if (inner.isConnected && box.contains(inner) && hasText(inner)) return; // still has text: nothing lost

    const sel = window.getSelection();
    if (!sel.rangeCount || !sel.isCollapsed) return;
    let caretNode = sel.getRangeAt(0).startContainer;
    if (!box.contains(caretNode)) return;

    // Elements the caret is still inside don't need a copy.
    let k = chain.findIndex((el) => el.isConnected && el.contains(caretNode));
    if (k < 0) k = chain.length;
    const lost = chain.slice(0, k);

    // Throw away the empty leftovers the caret isn't in.
    lost.forEach((el) => {
      if (el.isConnected && box.contains(el) && !hasText(el)) el.remove();
    });

    // Rebuild the lost elements, outermost first, with a ZWSP inside.
    const holder = document.createTextNode(ZWSP);
    let outer = holder;
    lost.forEach((el) => {          // innermost first: wrap from the inside out
      const copy = el.cloneNode(false);
      copy.appendChild(outer);
      outer = copy;
    });

    const range = sel.getRangeAt(0); // re-read: removals above may have moved it
    range.insertNode(outer);

    const caret = document.createRange();
    caret.setStart(holder, 1);
    caret.collapse(true);
    sel.removeAllRanges();
    sel.addRange(caret);
  }

  // ---- Keep text inside the page ------------------------------------------
  // Środek pierwszej linii tekstu w polu, w pikselach od lewego górnego rogu
  // pola: połowa szerokości i połowa wysokości tej linii. Pole puste:
  // początek pierwszej linii (tam stoi kursor).
  function firstLineCenter(box) {
    const b = box.getBoundingClientRect();
    const r = document.createRange();
    r.selectNodeContents(box);
    const rects = Array.from(r.getClientRects()).filter((q) => q.height > 0);
    if (rects.length) {
      // Wszystko, co zaczyna się wyżej niż kończy się najwyższy kawałek
      // tekstu, leży w pierwszej linii (też przy różnych wielkościach liter).
      const minBottom = Math.min(...rects.map((q) => q.bottom));
      const line = rects.filter((q) => q.top < minBottom);
      const left = Math.min(...line.map((q) => q.left));
      const right = Math.max(...line.map((q) => q.right));
      const top = Math.min(...line.map((q) => q.top));
      const bottom = Math.max(...line.map((q) => q.bottom));
      return { x: (left + right) / 2 - b.left, y: (top + bottom) / 2 - b.top };
    }
    const cs = getComputedStyle(box);
    return {
      // Wyśrodkowany tekst (podpis pod obrazem): kursor stoi na środku pola.
      x: cs.textAlign === "center"
        ? box.offsetWidth / 2
        : box.clientLeft + parseFloat(cs.paddingLeft),
      y: box.clientTop + parseFloat(cs.paddingTop) + BASE_FONT_SIZE * 1.3 * unitOf(box) / 2
    };
  }

  // Pasek narzędzi pola (rozmiar, B, I, czcionka, kolor) ma się mieścić na
  // stronie: przy prawej krawędzi przesuwa się w lewo, przy górnej
  // krawędzi przechodzi pod pole.
  const TOOLBAR_W = 262;   // szerokość paska (patrz .toolbar-strip)
  const TOOLBAR_H = 31;    // wysokość paska razem z odstępem od pola
  function placeToolbar(wrapper) {
    const page = wrapper && wrapper.parentElement;
    const box = wrapper && wrapper.querySelector(".textbox");
    if (!page || !box || !page.clientWidth) return;   // strona niewidoczna
    const left = wrapper.offsetLeft;
    const shift = Math.max(Math.min(0, page.clientWidth - (left + TOOLBAR_W)), -left);
    const below = wrapper.offsetTop < TOOLBAR_H;
    const hgt = box.offsetHeight;
    wrapper.style.setProperty("--tb-shift", shift + "px");
    wrapper.style.setProperty("--tb-drop", below ? (hgt + TOOLBAR_H + 3) + "px" : "0px");
    wrapper.style.setProperty("--tb-drop-strip", below ? (hgt + TOOLBAR_H) + "px" : "0px");
  }

  // Pole tekstowe przyciągnięte do kropki (data-anchor-x / -y): ustaw je tak,
  // żeby jego środek był na tej kropce (ale całe pole zostaje na stronie).
  // Wywoływane po każdej zmianie treści, więc pole rośnie równo w obie strony.
  function keepAnchored(box) {
    const ax = parseFloat(box.dataset.anchorX), ay = parseFloat(box.dataset.anchorY);
    if (isNaN(ax) || isNaN(ay)) return;
    const wrapper = box.parentElement;
    const page = wrapper && wrapper.parentElement;
    if (!page || !page.clientWidth || !page.clientHeight) return; // strona niewidoczna

    const W = page.offsetWidth, H = page.offsetHeight;
    // Na czas pomiaru cała szerokość strony jest dostępna, żeby tekst nie
    // zawijał się tylko dlatego, że pole stoi teraz bliżej prawej krawędzi.
    wrapper.style.left = "0px";
    const w = box.offsetWidth, hgt = box.offsetHeight;

        // Podpis pod obrazem: na kropce ma być środek PIERWSZEJ linii, nie całego pola.
    const c = box.dataset.anchorLine ? firstLineCenter(box) : { x: w / 2, y: hgt / 2 };
    const left = Math.min(Math.max(ax * W - c.x, 0), Math.max(page.clientWidth - w, 0));
    // Podpis pod obrazem nigdy nie wchodzi na obraz (duża czcionka = niżej).
    const wantTop = box.dataset.anchorImage ? captionTopPx(ay * H, c.y, W) : ay * H - c.y;
    const top  = Math.min(Math.max(wantTop, 0), Math.max(page.clientHeight - hgt, 0));
    wrapper.style.left = left + "px";
    wrapper.style.top = top + "px";
	placeToolbar(wrapper);
  }
  
  // Ile miejsca (piksele strony) potrzebują pod obrazem przyklejone do niego
  // podpisy: od dolnej krawędzi obrazu do dolnej krawędzi najniższego podpisu.
  // 0, gdy obraz nie ma podpisów.
  function captionRoomBelow(pageEl, imageId) {
    const u = pageEl.offsetWidth / REF_PAGE_W;
    let room = 0;
    pageEl.querySelectorAll(`.textbox[data-anchor-image="${imageId}"]`).forEach((box) => {
      if (!box.offsetHeight) return;   // pole ukryte
      const line = firstLineCenter(box);
      const gap = Math.max(CAPTION_GAP_UNITS * u - line.y, CAPTION_MIN_GAP_UNITS * u);
      room = Math.max(room, gap + box.offsetHeight);
    });
    return Math.ceil(room);
  }
  // Zakres, w którym może stać kropka pod obrazem (x, piksele strony), żeby
  // każdy przyklejony podpis dał się na niej wyśrodkować bez wychodzenia
  // poza stronę. Obraz bez podpisów: bez ograniczeń.
  function captionXRange(pageEl, imageId) {
    let min = -Infinity, max = Infinity;
    pageEl.querySelectorAll(`.textbox[data-anchor-image="${imageId}"]`).forEach((box) => {
      if (!box.offsetWidth) return;   // pole ukryte
      const c = firstLineCenter(box);
      min = Math.max(min, c.x);
      max = Math.min(max, pageEl.clientWidth - (box.offsetWidth - c.x));
    });
    return { min, max };
  }

  // True if the box's bottom edge is still inside the page (border excluded).
  // Podpis przyklejony do obrazu musi się zmieścić BEZ podsuwania go do góry
  // (inaczej wszedłby na obraz): wtedy zmiana jest cofana albo tekst zmniejszany,
  // tak samo jak przy zwykłym polu, które wychodzi poza stronę.
  function fitsInPage(box) {
    keepAnchored(box);   // pole przyciągnięte do kropki: najpierw je wyśrodkuj
    const wrapper = box.parentElement;
    const page = wrapper && wrapper.parentElement;
    if (!wrapper || !page) return true;
    if (box.dataset.anchorImage && page.offsetHeight) {
      const ay = parseFloat(box.dataset.anchorY);
      const c = firstLineCenter(box);
      if (captionTopPx(ay * page.offsetHeight, c.y, page.offsetWidth)
          + box.offsetHeight > page.clientHeight + 0.5) return false;
    }
    const fits = wrapper.offsetTop + box.offsetHeight <= page.clientHeight;
    placeToolbar(wrapper);   // pole mogło urosnąć: pasek pod nim przesuwa się razem
    return fits;
  }

  // Shrinks a sized fragment (<span class="fs">) until the box fits in the page.
  function fitSpanFontSize(box, span, requested) {
    let size = requested;
    span.style.fontSize = sizeCss(size);
    while (size > 1 && !fitsInPage(box)) {
      size--;
      span.style.fontSize = sizeCss(size);
    }
    return size;
  }

  // Make every element in `targets` smaller, one step at a time, until the
  // box fits in the page again. False if even size 1 doesn't fit.
  function shrinkAllToFit(box, targets) {
    const sizes = targets.map((el) =>
      Math.round(parseFloat(getComputedStyle(el).fontSize) / unitOf(el)));
    targets.forEach((el, i) => { el.style.fontSize = sizeCss(sizes[i]); });

    while (!fitsInPage(box)) {
      let changed = false;
      sizes.forEach((s, i) => {
        if (s > 1) {
          sizes[i] = s - 1;
          targets[i].style.fontSize = sizeCss(sizes[i]);
          changed = true;
        }
      });
      if (!changed) return false;
    }
    return true;
  }

  // A font change made the box stick out below the page: make the text in
  // `span` (and any sized parts inside it) smaller until it fits.
  function shrinkToFit(box, span) {
    return shrinkAllToFit(box, [span, ...span.querySelectorAll("span.fs")]);
  }

  // Bold / italic made the box stick out below the page: make the selected
  // text smaller until it fits. Each selected piece of text gets its own
  // size span, so pieces with different sizes keep their differences.
  // False if there is no selection or even size 1 doesn't fit.
  function shrinkSelectionToFit(box) {
    const sel = window.getSelection();
    if (!sel.rangeCount) return false;
    const range = sel.getRangeAt(0);
    if (range.collapsed || !box.contains(range.commonAncestorContainer)) return false;

    const nodes = splitTextNodesInRange(range)
      .filter((t) => t.data.replace(/\u200B/g, "") !== "");
    if (!nodes.length) return false;

    const spans = nodes.map((t) => {
      const p = t.parentElement;
      // Already alone in its own size span: reuse it.
      if (p && p.matches("span.fs") && p.childNodes.length === 1) return p;
      const s = document.createElement("span");
      s.className = "fs";
      t.parentNode.insertBefore(s, t);
      s.appendChild(t);
      return s;
    });

    const ok = shrinkAllToFit(box, spans);

    // Keep the same text selected.
    const first = nodes[0], last = nodes[nodes.length - 1];
    const r = document.createRange();
    r.setStart(first, 0);
    r.setEnd(last, last.length);
    sel.removeAllRanges();
    sel.addRange(r);
    return ok;
  }

  // Paints a range as if it were selected (or clears it with null).
  function setFragmentHighlight(range) {
    if (!window.CSS || !CSS.highlights) return; // API not available: do nothing
    if (range) CSS.highlights.set("fs-selection", new Highlight(range));
    else CSS.highlights.delete("fs-selection");
  }

  // ---- Caret positions as character counts -------------------------------
  // A position inside a box as a number of characters from its start (each
  // <br> counts as one), so it can be found again after the box's content is
  // replaced or the box is rebuilt.

  function offsetIn(box, container, offset) {
    const pre = document.createRange();
    pre.selectNodeContents(box);
    pre.setEnd(container, offset);
    const frag = pre.cloneContents();
    return frag.textContent.length + frag.querySelectorAll("br").length;
  }

  // A collapsed range at a character count. Past the end: the end of the box.
  function rangeAtOffset(box, offset) {
    const range = document.createRange();
    const walker = document.createTreeWalker(box, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    let remaining = offset, node, placed = false;
    while (!placed && (node = walker.nextNode())) {
      if (node.nodeType === Node.TEXT_NODE) {
        if (remaining <= node.length) { range.setStart(node, remaining); placed = true; }
        else remaining -= node.length;
      } else if (node.nodeName === "BR") {
        if (remaining === 0) { range.setStartBefore(node); placed = true; }
        else remaining -= 1;
      }
    }
    if (placed) range.collapse(true);
    else { range.selectNodeContents(box); range.collapse(false); }
    return range;
  }

  // A range from one character count to another (a caret if they're equal).
  function rangeFromOffsets(box, start, end) {
    const a = rangeAtOffset(box, start);
    const b = rangeAtOffset(box, end);
    const r = document.createRange();
    r.setStart(a.startContainer, a.startOffset);
    r.setEnd(b.startContainer, b.startOffset);
    return r;
  }

  function getCaretOffset(box) {
    const sel = window.getSelection();
    if (!sel.rangeCount || !box.contains(sel.anchorNode)) return null;
    const r = sel.getRangeAt(0);
    return offsetIn(box, r.startContainer, r.startOffset);
  }

  function setCaretOffset(box, offset) {
    const sel = window.getSelection();
    sel.removeAllRanges();
    sel.addRange(rangeAtOffset(box, offset));
  }

  function takeSnapshot(box) {
    return { html: box.innerHTML, caret: getCaretOffset(box) };
  }

  function restoreSnapshot(box, snap) {
    box.innerHTML = snap.html;
	keepAnchored(box);
    if (snap.caret !== null) setCaretOffset(box, snap.caret);
  }

  function attachOverflowGuard(box) {
    let snap = null;
    let deletedChain = null;
    box.addEventListener("beforeinput", (e) => {
      if (!e.isComposing) snap = takeSnapshot(box);
      deletedChain = (!e.isComposing
                      && e.inputType.startsWith("delete")
                      && e.inputType !== "deleteByDrag"
                      && e.inputType !== "deleteCompositionText")
        ? chainBeingDeleted(box, e)
        : null;
    });
    box.addEventListener("compositionstart", () => { snap = takeSnapshot(box); });
    const check = () => {
      if (snap && !fitsInPage(box)) restoreSnapshot(box, snap);
      snap = null; // never reuse a snapshot for a later edit
    };
    box.addEventListener("input", (e) => {
      if (e.isComposing) return;
      check();
      keepFormatAfterDelete(box, deletedChain);
      deletedChain = null;
      stripZwsp(box);
      updateFormatButtons(box);
	  placeToolbar(box.parentElement);
    });
    box.addEventListener("compositionend", () => { check(); stripZwsp(box); });
    box.addEventListener("paste", (e) => pasteIntoBox(box, e));
  }

  // ---- Zapisywanie i otwieranie plików --------------------------------------
  // Pliki czyta i zapisuje program (main.cpp), bo tylko on zna ich położenie
  // na dysku. Strona wysyła mu tekst "polecenie\ndane" i dostaje odpowiedzi
  // w tej samej postaci.

  const FILE_APP = "KronikaSzkolna";
  const FILE_VERSION = 1;

  // false, gdy strona nie działa w programie (np. otwarta w przeglądarce).
  function hostPost(text) {
    const wv = window.chrome && window.chrome.webview;
    if (!wv) return false;
    wv.postMessage(text);
    return true;
  }

  // Treść pola bez niewidocznych znaków i bez pustych, nieużytych formatów.
  function cleanBoxHtml(html) {
    const t = document.createElement("template");
    t.innerHTML = html || "";
    Array.from(t.content.querySelectorAll(PENDING_SELECTOR)).reverse().forEach((el) => {
      if (el.textContent.replace(/\u200B/g, "") === "" && !el.querySelector("br")) el.remove();
    });
    const holder = document.createElement("div");
    holder.appendChild(t.content);
    return holder.innerHTML.replace(/\u200B/g, "");
  }

  function htmlHasText(html) {
    const t = document.createElement("template");
    t.innerHTML = html || "";
    return t.content.textContent.replace(/\u200B/g, "").trim().length > 0;
  }

  // Treść pola z pliku: zostają tylko pogrubienie, kursywa, rozmiar,
  // czcionka i kolor. Wszystko inne (skrypty, linki, obrazki...) znika.
  const XHTML_NS = "http://www.w3.org/1999/xhtml";
  const ALLOWED_TAGS = new Set(["B", "STRONG", "I", "EM", "SPAN", "BR"]);
  const DROPPED_TAGS = new Set(["script", "style", "template", "iframe", "object", "embed", "noscript"]);
  function sanitizeBoxHtml(html) {
    const t = document.createElement("template");
    t.innerHTML = typeof html === "string" ? html : "";
    Array.from(t.content.querySelectorAll("*")).reverse().forEach((el) => {
      if (el.namespaceURI !== XHTML_NS || !ALLOWED_TAGS.has(el.nodeName)) {
        if (DROPPED_TAGS.has(el.localName)) el.remove();
        else el.replaceWith(...el.childNodes);
        return;
      }
      const fs = el.style.fontSize, ff = el.style.fontFamily, c = el.style.color;
      const cls = el.nodeName === "SPAN" ? ["fs", "ff", "fc"].filter((k) => el.classList.contains(k)) : [];
      Array.from(el.attributes).forEach((a) => el.removeAttribute(a.name));
      if (cls.length) el.className = cls.join(" ");
      if (fs) el.style.fontSize = fs;
      if (ff) el.style.fontFamily = ff;
      if (c) el.style.color = c;
    });
    const holder = document.createElement("div");
    holder.appendChild(t.content);
    return holder.innerHTML;
  }

  // "Odcisk" zawartości do sprawdzania, czy coś się zmieniło. Strony są
  // liczone po kolei (dodanie i usunięcie stron nic nie zmienia), położenie
  // pola przypiętego do kropki wynika z kropki.
  function docSnapshot(doc) {
    const index = new Map(doc.pageKeys.map((k, i) => [k, i]));
    const pg = (k) => (index.has(k) ? index.get(k) : k);   // okładki: "c1" / "c2"
    const r = (n) => (typeof n === "number" ? Math.round(n * 1e5) / 1e5 : null);
    return JSON.stringify({
      pages: doc.pageKeys.length,
      boxes: doc.boxes.map((b) => b.anchor
        ? [pg(b.page), r(b.width), b.html, r(b.anchor.x), r(b.anchor.y), !!b.anchor.line, b.anchor.imageId ?? null]
        : [pg(b.page), r(b.width), b.html, r(b.left), r(b.top)]),
      images: doc.images.map((im) => [im.id, pg(im.page), r(im.left), r(im.top), r(im.w), r(im.h)])
    });
  }

  // Tekst pliku -> zawartość kroniki, albo null, jeśli to nie jest plik kroniki.
  function parseDocument(text) {
    let d;
    try { d = JSON.parse(text); } catch (e) { return null; }
    if (!d || typeof d !== "object" || d.app !== FILE_APP) return null;
    if (typeof d.version !== "number" || d.version < 1 || d.version > FILE_VERSION) return null;

    const isNum = (n) => typeof n === "number" && isFinite(n);
    const isId = (n) => Number.isInteger(n) && n > 0;

    if (!Array.isArray(d.pageKeys) || d.pageKeys.length % 2 !== 0) return null;
    if (!d.pageKeys.every((k) => typeof k === "string" && /^p\d+$/.test(k))) return null;
    const keys = new Set(d.pageKeys);
    if (keys.size !== d.pageKeys.length) return null;
    const onPage = (k) => keys.has(k) || k === "c1" || k === "c2";
    if (!Array.isArray(d.images) || !Array.isArray(d.boxes)) return null;

    const imageIds = new Set();
    const images = [];
    for (const im of d.images) {
      if (!im || !isId(im.id) || imageIds.has(im.id) || !onPage(im.page)) return null;
      if (typeof im.src !== "string" || !im.src.startsWith("data:image/")) return null;
      if (![im.left, im.top, im.w, im.h].every(isNum) || im.w <= 0 || im.h <= 0) return null;
      imageIds.add(im.id);
      images.push({ id: im.id, page: im.page, src: im.src, left: im.left, top: im.top, w: im.w, h: im.h });
    }

    const boxIds = new Set();
    const boxes = [];
    for (const b of d.boxes) {
      if (!b || !isId(b.id) || boxIds.has(b.id) || !onPage(b.page)) return null;
      if (!isNum(b.left) || !isNum(b.top) || typeof b.html !== "string") return null;
      if (b.width != null && !(isNum(b.width) && b.width > 0)) return null;
      let anchor = null;
      if (b.anchor) {
        const a = b.anchor;
        if (!isNum(a.x) || !isNum(a.y)) return null;
        anchor = { x: a.x, y: a.y, line: !!a.line };
        if (a.imageId != null) {
          if (imageIds.has(a.imageId)) anchor.imageId = a.imageId;
          else anchor = null;   // obrazu już nie ma: zwykłe pole
        }
      }
      const html = cleanBoxHtml(sanitizeBoxHtml(b.html));
      if (!htmlHasText(html)) continue;
      boxIds.add(b.id);
      boxes.push({ id: b.id, page: b.page, left: b.left, top: b.top,
                   width: isNum(b.width) ? b.width : undefined, anchor, html });
    }

    let maxKey = 0;
    d.pageKeys.forEach((k) => { maxKey = Math.max(maxKey, parseInt(k.slice(1), 10)); });
    const nextPageNum = Math.max(maxKey + 1, Number.isInteger(d.nextPageNum) ? d.nextPageNum : 0);

    return { app: FILE_APP, version: FILE_VERSION, pageKeys: d.pageKeys.slice(), nextPageNum, boxes, images };
  }

  function App() {
    const bookRef = useRef(null);
    const wrapRef = useRef(null);
    const flipbookContainerRef = useRef(null);
    const [page, setPage] = useState(0);
    const [orientation, setOrientation] = useState("landscape");
    const [size, setSize] = useState(computePageSize);
    const [bookReady, setBookReady] = useState(false);

    // Keys of the inner pages, in order. Keys are never reused or renumbered,
    // so boxes (which store their page key) stay on the right page after a
    // deletion.
    const [pageKeys, setPageKeys] = useState(() =>
      Array.from({ length: INITIAL_INNER_PAGES }, (_, i) => `p${i + 1}`)
    );
    const total = pageKeys.length + 2; // + front and back cover
    // Next number for a new page key (p11, p12, ...). Only ever goes up,
    // so a key that was deleted is never handed out again.
    const nextPageNumRef = useRef(INITIAL_INNER_PAGES + 1);
    // Bumped after adding/deleting pages so the flipbook remounts with the new page list.
    const [bookVersion, setBookVersion] = useState(0);

    // Delete confirmation dialog. The ref is for the native keydown listener
    // (attached once); dialogPages keeps the text stable while it fades out.
    const [dialogOpen, setDialogOpen] = useState(false);
    const [dialogPages, setDialogPages] = useState("");
    const dialogOpenRef = useRef(false);
    // Toast in the bottom-left corner. The text is kept after hiding so it
    // doesn't vanish mid fade-out.
    const [toastText, setToastText] = useState("");
    const [toastVisible, setToastVisible] = useState(false);
    const [toastQuick, setToastQuick] = useState(false); // fast fade-out while being replaced
    const toastVisibleRef = useRef(false);   // read by showToast without waiting for a render
    const toastTimerRef = useRef(0);         // hides the toast after a while
    const toastRestartTimerRef = useRef(0);  // brings the new toast in after the quick fade-out

    const showToast = (text) => {
      clearTimeout(toastTimerRef.current);
      clearTimeout(toastRestartTimerRef.current);
      setToastText(text);

      const reveal = () => {
        toastRestartTimerRef.current = 0;
        toastVisibleRef.current = true;
        setToastQuick(false);  // normal speed for the slide-in
        setToastVisible(true);
        toastTimerRef.current = setTimeout(() => {
          toastVisibleRef.current = false;
          setToastVisible(false);
        }, 2500);
      };

      // A toast is on screen (or is just being replaced): make it disappear
      // quickly first, then bring the new one in, so every click is noticeable.
      if (toastVisibleRef.current || toastRestartTimerRef.current) {
        toastVisibleRef.current = false;
        setToastQuick(true);
        setToastVisible(false);
        toastRestartTimerRef.current = setTimeout(reveal, 130);
      } else {
        reveal();
      }
    };

    // Keep the current spread across remounts without re-rendering on every flip.
    const pageRef = useRef(0);
    pageRef.current = page;

    // Single active-tool switch instead of two independent booleans, so
    // pressing one button always releases the other. Text mode ("A"): click
    // empty space on a page/cover to drop a new text box and start typing.
    // Move mode (cross-arrows): drag existing boxes and pictures to reposition them.
    const toolRef = useRef(TOOL_NONE);
    const [tool, setTool] = useState(TOOL_NONE);

    const [boxes, setBoxes] = useState([]); // { id, page, left, top, html, width }
    // Mirrors `boxes` for the native pointerdown listener below, which is
    // attached once (see the empty dependency array on its effect) and so
    // must never read the `boxes` variable directly — that would capture
    // whatever `boxes` was on the render the listener was attached during.
    const boxesRef = useRef([]);
    boxesRef.current = boxes;
    const boxIdRef = useRef(0);
    const boxRefs = useRef({});
    const focusIdRef = useRef(null);
    // The box being edited when the book has to be rebuilt because the page
    // size changed: { boxId, start, end } (caret / selection as character
    // counts). It gets focus back, with the same caret, once rebuilt.
    const refocusRef = useRef(null);

    // Move mode: the box or picture Ctrl+C copies (at most one of the two).
    // The refs are for the native listeners (attached once), the state is
    // only for rendering the outline.
    const selectedIdRef = useRef(null);
    const [selectedId, setSelectedId] = useState(null);
    const selectedImageIdRef = useRef(null);
    const [selectedImageId, setSelectedImageId] = useState(null);
    // Select a text box (or nothing, with null). Always clears a selected picture.
    const selectBox = (id) => {
      selectedIdRef.current = id;
      setSelectedId(id);
      selectedImageIdRef.current = null;
      setSelectedImageId(null);
    };
    // Select a picture. Always clears a selected text box.
    const selectImage = (id) => {
      selectedIdRef.current = null;
      setSelectedId(null);
      selectedImageIdRef.current = id;
      setSelectedImageId(id);
    };

    // Internal clipboard: only filled by Ctrl+C in move mode, so text copied
    // anywhere else can never be pasted as a box.
    const clipboardRef = useRef(null);

    // Last caret position or text selection inside a textbox, kept alive
    // while the user clicks into the font-size input or font list (which
    // would otherwise erase it).
    const savedRangeRef = useRef(null);

    // Last known mouse position, so Ctrl+V can paste under the cursor.
    const lastPointerRef = useRef({ x: 0, y: 0, known: false });

    // Font color panel: { boxId, anchor, current, onApply } or null.
    const [colorPicker, setColorPicker] = useState(null);
	
    // ---- Narzędzie wyrównywania (magnes) ----------------------------------
    // Niezależne od narzędzi tekstu / przesuwania: może działać razem z nimi.
    const [alignOn, setAlignOn] = useState(false);
    const [alignLayout, setAlignLayout] = useState(0);
    // Dla natywnych listenerów (podpiętych raz).
    const alignRef = useRef({ on: false, layout: 0 });
    alignRef.current = { on: alignOn, layout: alignLayout };

        // ---- Narzędzie "wyrównywanie tekstu do obrazów" ------------------------
    // Działa razem z narzędziami tekstu / przesuwania, ale NIE razem
    // z wyrównywaniem do punktów (i odwrotnie).
    const [captionOn, setCaptionOn] = useState(false);
    const captionRef = useRef(false);   // dla natywnych listenerów
    captionRef.current = captionOn;

    const toggleCaption = () => {
      if (alignOn) return;              // wyrównywanie do punktów jest włączone
	  if (coverLock) return; // okładka: narzędzie niedostępne
      setCaptionOn(!captionOn);
    };

    const toggleAlign = () => {
      if (captionOn) return;            // wyrównywanie do obrazów jest włączone
      if (coverLock) return; // okładka: narzędzie niedostępne
      if (!alignOn) setAlignLayout(0);  // po każdym włączeniu: pierwsza opcja
      setAlignOn(!alignOn);
    };

    // Przyciąganie do kropki, tylko gdy narzędzie jest włączone.
    // Wszystkie wartości to ułamki strony.
    const snapNear = (pageEl, left, top, wf, hf) => {
      const a = alignRef.current;
      return a.on ? snapToDot(pageEl, a.layout, left, top, wf, hf) : null;
    };
    // Przyciąganie pierwszej linii tekstu do kropki pod obrazem, tylko gdy
    // narzędzie jest włączone. Tylko teksty tego używają (obrazy nie).
    const snapCaption = (pageEl, cx, cy, offX, offY, boxW, boxH) => {
      if (!captionRef.current || !pageEl) return null;
      const key = pageEl.dataset.pageKey;
      const imgs = imagesRef.current.filter((im) => im.page === key);
      return snapToCaption(pageEl, imgs, cx, cy, offX, offY, boxW, boxH);
    };

    // Aktualne położenie pola wyśrodkowanego na kropce, odczytane z ekranu
    // (podczas pisania przesuwa się ono bez zmiany stanu React).
    const livePos = (b, el) => {
      if (!b.anchor || !el) return {};
      const wrapper = el.parentElement;
      const pageEl = wrapper && wrapper.parentElement;
      if (!pageEl || !pageEl.offsetWidth || !pageEl.offsetHeight) return {};
      return {
        left: wrapper.offsetLeft / pageEl.offsetWidth,
        top:  wrapper.offsetTop / pageEl.offsetHeight
      };
    };

    const commitBoxPos = (id, el) => {
      const b = boxesRef.current.find((x) => x.id === id);
      if (!b || !b.anchor) return;
      keepAnchored(el);   // najpierw wyśrodkuj (rozmiar mógł się właśnie zmienić)
      const pos = livePos(b, el);
      if (pos.left === undefined) return;
      setBoxes((prev) => prev.map((x) => x.id === id ? { ...x, ...pos } : x));
    };
	
    // Po przesunięciu / zmianie rozmiaru obrazu: zapisz w stanie nowe
    // położenie podpisów przyklejonych do niego (na ekranie już się przesunęły).
    const commitImageFollowers = (imageId) => {
      const updates = {};
      boxesRef.current.forEach((b) => {
        if (!b.anchor || b.anchor.imageId !== imageId) return;
        const el = boxRefs.current[b.id];
        if (!el) return;
        const pos = livePos(b, el);
        if (pos.left === undefined) return;
        updates[b.id] = {
          ...pos,
          anchor: { ...b.anchor, x: parseFloat(el.dataset.anchorX), y: parseFloat(el.dataset.anchorY) }
        };
      });
      if (!Object.keys(updates).length) return;
      setBoxes((prev) => prev.map((b) => updates[b.id] ? { ...b, ...updates[b.id] } : b));
    };

    // Pictures on pages: { id, page, src, left, top, w, h } (fractions of the page).
    const [images, setImages] = useState([]);
    // Mirrors `images` for the native listeners (attached once).
    const imagesRef = useRef([]);
    imagesRef.current = images;
    const imageIdRef = useRef(0);

    // "Dodaj obraz" window. The ref is for the native listeners (attached once).
    const [imageDialogOpen, setImageDialogOpen] = useState(false);
    const imageDialogOpenRef = useRef(false);
    const imageInputRef = useRef(null);
    // Bumped whenever the window opens/closes or the waiting picture is
    // cancelled, so a file that finishes loading afterwards is ignored.
    const imageLoadTokenRef = useRef(0);

    // The chosen picture waiting for a click on a page: { src, w, h },
    // { loading: true } while the file is still being read, or null.
    // Used exactly once, then forgotten.
    const [pendingImage, setPendingImageState] = useState(null);
    const pendingImageRef = useRef(null);
    // A click on a page made while the picture was still loading: it gets
    // placed there as soon as the picture is ready.
    const queuedPlaceRef = useRef(null);
    // null also cancels a picture that is still loading in the background.
    const setPendingImage = (img) => {
      if (!img) {
        imageLoadTokenRef.current++;
        queuedPlaceRef.current = null;
      }
      pendingImageRef.current = img;
      setPendingImageState(img);
    };

    // Clicking the color button opens the panel; clicking it again closes it.
    const openColorPicker = (boxId, rect, current, onApply) => {
      setColorPicker((prev) => prev && prev.boxId === boxId ? null : {
        boxId,
        anchor: { left: rect.left, top: rect.top, bottom: rect.bottom },
        current,
        onApply
      });
    };

    // Any click outside the panel (and outside a color button) only closes
    // it: the click itself is swallowed, so it can't create a new text box,
    // press a button, flip a page or move the caret.
    useEffect(() => {
      if (!colorPicker) return;
      const onDown = (e) => {
        const t = e.target;
        if (t.closest && (t.closest(".color-picker") || t.closest(".format-color"))) return;

        e.preventDefault();   // keep focus and selection in the text
        e.stopPropagation();  // never reaches the page, toolbar or flipbook

        // The "click" that follows this press must not do anything either
        // (buttons like "Następna ▶" or the tool buttons react to it).
        const swallowClick = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
        window.addEventListener("click", swallowClick, true);
        window.addEventListener("mouseup", () => {
          setTimeout(() => window.removeEventListener("click", swallowClick, true), 0);
        }, { capture: true, once: true });

        setColorPicker(null);
      };
      const onResize = () => setColorPicker(null);
      document.addEventListener("mousedown", onDown, true);
      window.addEventListener("resize", onResize);
      return () => {
        document.removeEventListener("mousedown", onDown, true);
        window.removeEventListener("resize", onResize);
      };
    }, [colorPicker]);

    // Remove the placeholder spacer after the first render cycle completes
    useEffect(() => {
      const timer = setTimeout(() => setBookReady(true), 0);
      return () => clearTimeout(timer);
    }, []);

    // Hide the flipbook until it's fully initialized, then fade it in
    useEffect(() => {
      if (!bookReady || !bookRef.current) return;

      // Wait a frame to ensure the page-flip library has fully rendered all pages
      const timer = setTimeout(() => {
        if (flipbookContainerRef.current) {
          flipbookContainerRef.current.classList.remove('hidden');
        }
      }, 16);

      return () => clearTimeout(timer);
    }, [bookReady, bookRef.current]);

    // Check if current page is a cover (front or back)
    const isCurrentPageCover = () => page === 0 || page > pageKeys.length;
    // Książka właśnie się zamyka (przewracanie, które skończy się na okładce).
    const [closing, setClosing] = useState(false);
    // Kierunek ostatnio rozpoczętego przewracania: "next" albo "prev".
    const flipDirRef = useRef("next");
    // Okładka albo zamykanie książki: narzędzia blokują się,
    // a podpowiedzi chowają od razu.
    const coverLock = isCurrentPageCover() || closing;
    const hideHints = coverLock;
    const syncBoxesFromDOM = () => {
      setBoxes((prev) => prev.map((b) => {
        const el = boxRefs.current[b.id];
        return el ? { ...b, html: el.innerHTML, ...livePos(b, el) } : b;
      }));
    };

    // Before the book is rebuilt for a new page size: remember which text
    // box is being edited and where its caret / selection is.
    const rememberFocusedBox = () => {
      refocusRef.current = null;
      const a = document.activeElement;
      if (!a || !a.classList || !a.classList.contains("textbox") || !a.isContentEditable) return;
      let start = Infinity, end = Infinity;   // no selection: caret at the end
      const sel = window.getSelection();
      if (sel.rangeCount && a.contains(sel.anchorNode)) {
        const r = sel.getRangeAt(0);
        start = offsetIn(a, r.startContainer, r.startOffset);
        end = offsetIn(a, r.endContainer, r.endOffset);
      }
      refocusRef.current = { boxId: Number(a.dataset.boxId), start, end };
    };

    // A box only "counts" once it has text in it. Called on blur, and when
    // a tool is switched off/away while a box is still focused, so an empty
    // box a user clicked into (but never typed in) never lingers on the page.
    const pruneIfEmpty = (id) => {
      const el = boxRefs.current[id];
      if (!boxHasText(el)) {
        setBoxes((prev) => prev.filter((b) => b.id !== id));
        delete boxRefs.current[id];
      }
    };

    // Remove every currently-tracked box that has no text in it. Used
    // instead of "find the one box that's still focused" whenever we leave
    // text mode — chasing document.activeElement doesn't work reliably
    // here because the toggle buttons use `user-select: none`, which stops
    // the browser from blurring a focused contentEditable on mousedown in
    // the first place. This sweep has no dependency on focus timing at all:
    // it just checks every box's actual content.
    const pruneAllEmpty = () => {
      setBoxes((prev) => prev.filter((b) => {
        const hasText = boxHasText(boxRefs.current[b.id]);
        if (!hasText) delete boxRefs.current[b.id];
        return hasText;
      }));
    };

    const selectTool = (next) => {
      const wasTextEditing = toolRef.current === TOOL_TEXT;
      const resolved = toolRef.current === next ? TOOL_NONE : next; // click active tool again to turn it off

      // Blur whatever's currently focused so its latest content is
      // committed to the DOM before pruneAllEmpty reads it below.
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      toolRef.current = resolved;
      setTool(resolved);
      selectBox(null);
      setPendingImage(null);        // another tool: forget a picture waiting to be placed
      savedRangeRef.current = null;
      setFragmentHighlight(null);
      if (wasTextEditing && resolved !== TOOL_TEXT) {
        pruneAllEmpty();
      }
    };

    const toggleTextMode = () => {
      if (coverLock) return;
      selectTool(TOOL_TEXT);
    };
    const toggleMoveMode = () => {
      if (coverLock) return;
      selectTool(TOOL_MOVE);
    };

    // ---- Delete the currently displayed spread -----------------------------

    const openDeleteDialog = () => {
      if (coverLock || dialogOpenRef.current) return;

      // Commit whatever is being typed and drop any selection first.
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      selectBox(null);
      setPendingImage(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);
      setDialogPages(`${page + 1}–${page + 2}`);
      dialogOpenRef.current = true;
      setDialogOpen(true);
    };

    const closeDeleteDialog = () => {
      dialogOpenRef.current = false;
      setDialogOpen(false);
    };

    const deleteCurrentSpread = () => {
      closeDeleteDialog();

      // `page` is the flipbook index of the spread's left page; inner page
      // keys are offset by one because index 0 is the front cover.
      if (page < 1 || page + 1 > pageKeys.length) return;
      freezeBook();
      const removed = new Set([pageKeys[page - 1], pageKeys[page]]);
      const remaining = pageKeys.filter((k) => !removed.has(k));

      // Stay on the same spread position (the following pages slide in);
      // if the last spread was deleted, go back one; if nothing is left,
      // show the front cover (pages can be added back from there).
      let next = page;
      if (next > remaining.length) next = remaining.length - 1;
      if (next < 1) next = 0;

      // The remount recreates every textbox node, so capture live content
      // first, and drop the boxes that lived on the deleted pages.
      setBoxes((prev) => prev
        .map((b) => {
          const el = boxRefs.current[b.id];
          return el ? { ...b, html: el.innerHTML } : b;
        })
        .filter((b) => {
          if (!removed.has(b.page)) return true;
          delete boxRefs.current[b.id];
          return false;
        })
      );

      // Pictures on the deleted pages go too.
      setImages((prev) => prev.filter((im) => !removed.has(im.page)));

      // Tools can't be active on a cover.
      if (next === 0) {
        toolRef.current = TOOL_NONE;
        setTool(TOOL_NONE);
      }

      setPageKeys(remaining);
      setPage(next);                 // also feeds startPage via pageRef
      setBookVersion((v) => v + 1);  // remount the book with the new pages
    };
	
    const addPages = () => {
      if (dialogOpenRef.current) return;
      // Okładka: niedostępne, chyba że książka nie ma już żadnych stron.
      if (coverLock && pageKeys.length > 0) return;
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      freezeBook();
      selectBox(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);

      // `page` is the flipbook index of the spread's left page. Inner page
      // keys are offset by one (index 0 is the front cover), so the spread's
      // right page is pageKeys[page].
      let insertAt;
      if (page === 0) insertAt = 0;
      else if (page > pageKeys.length) insertAt = pageKeys.length;
      else insertAt = page + 1;

      const newKeys = [
        `p${nextPageNumRef.current++}`,
        `p${nextPageNumRef.current++}`
      ];

      // The remount recreates every textbox node, so capture live content
      // first, and drop any box that was clicked into but never typed in.
      setBoxes((prev) => prev
        .map((b) => {
          const el = boxRefs.current[b.id];
          return el ? { ...b, html: el.innerHTML } : b;
        })
        .filter((b) => {
          if (boxHasText(boxRefs.current[b.id])) return true;
          delete boxRefs.current[b.id];
          return false;
        })
      );

      setPageKeys((prev) => [...prev.slice(0, insertAt), ...newKeys, ...prev.slice(insertAt)]);
      setBookVersion((v) => v + 1);  // remount the book with the new pages
      // `page` is unchanged, so startPage (via pageRef) keeps the current
      // position. On the back cover that position now shows the new pages.
      showToast("Dodano dwie strony");
    };

    // ---- Add an image ----------------------------------------------------------

    const openImageDialog = () => {
      if (dialogOpenRef.current || imageDialogOpenRef.current) return;
      if (coverLock) return;
      // Commit whatever is being typed; no tool stays active.
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      if (toolRef.current === TOOL_TEXT) pruneAllEmpty();
      toolRef.current = TOOL_NONE;
      setTool(TOOL_NONE);
      selectBox(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);

      setPendingImage(null);   // always start from the beginning
      imageLoadTokenRef.current++;
      imageDialogOpenRef.current = true;
      setImageDialogOpen(true);
    };

    const closeImageDialog = () => {
      imageLoadTokenRef.current++;
      imageDialogOpenRef.current = false;
      setImageDialogOpen(false);
    };

    // "Wybierz plik…": the normal Windows file picker, one file only.
    const chooseImageFile = () => {
      const input = imageInputRef.current;
      if (!input) return;
      input.value = "";
      input.click();
    };

    const onImageFileChosen = (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";  // the app never remembers a chosen file
      if (!file || !imageDialogOpenRef.current) return;

      if (!IMAGE_EXT_RE.test(file.name)) {
        showToast("Wybrany plik nie jest obrazem");
        return;             // the window stays open: choose again or "Anuluj"
      }

      // Close the window right away; the picture loads in the background.
      closeImageDialog();
      const token = imageLoadTokenRef.current;
      setPendingImage({ loading: true });

      const failed = () => {
        if (token !== imageLoadTokenRef.current) return;
        setPendingImage(null);
        showToast("Nie udało się otworzyć obrazu");
      };
      const reader = new FileReader();
      reader.onerror = failed;
      reader.onload = () => {
        if (token !== imageLoadTokenRef.current) return;  // cancelled meanwhile
        const src = reader.result;
        const probe = new Image();
        probe.onerror = failed;
        probe.onload = () => {
          if (token !== imageLoadTokenRef.current) return;
          setPendingImage({
            src,
            w: probe.naturalWidth || 200,   // some SVGs have no size of their own
            h: probe.naturalHeight || 200
          });
          // The user already clicked a page while it was loading: place it there.
          const q = queuedPlaceRef.current;
          queuedPlaceRef.current = null;
          if (q && q.pageEl.isConnected) placeImageAt(q.pageEl, q.fx, q.fy);
        };
        probe.src = src;
      };
      reader.readAsDataURL(file);   // stored inside the app, not as a link to the file
    };

    // A click on a page while a picture is waiting (or still loading). The
    // position is stored as a fraction of the page, so it stays valid even
    // if the page moves before the picture is ready.
    const placeImage = (pageEl, clientX, clientY) => {
      const img = pendingImageRef.current;
      if (!img) return;
      const rect = pageEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;   // page not on screen
      const fx = (clientX - rect.left) / rect.width;
      const fy = (clientY - rect.top) / rect.height;
      if (img.loading) {
        // Not ready yet: remember the click (the last one wins).
        queuedPlaceRef.current = { pageEl, fx, fy };
        return;
      }
      placeImageAt(pageEl, fx, fy);
    };

    // Put the waiting picture on an inner page, centered on the given point
    // (fractions of the page) and kept inside the page. One picture per choice.
    const placeImageAt = (pageEl, fx, fy) => {
      const img = pendingImageRef.current;
      if (!img || img.loading) return;

      const pageW = pageEl.offsetWidth, pageH = pageEl.offsetHeight;
      if (!pageW || !pageH) return;   // page hidden (flipped away): keep waiting

      // At most MAX_IMAGE_PART of the page; small pictures are not blown up
      // (one picture pixel = one page unit, same as text sizes).
      const scale = Math.min(
        MAX_IMAGE_PART * pageW / img.w,
        MAX_IMAGE_PART * pageH / img.h,
        pageW / REF_PAGE_W
      );
      const w = img.w * scale / pageW;
      const hgt = img.h * scale / pageH;

      const maxLeft = Math.max(pageEl.clientWidth / pageW - w, 0);
      const maxTop  = Math.max(pageEl.clientHeight / pageH - hgt, 0);
      let left = Math.min(Math.max(fx - w / 2, 0), maxLeft);
      let top  = Math.min(Math.max(fy - hgt / 2, 0), maxTop);
      // Narzędzie wyrównywania: obok kropki środek obrazu ląduje na niej.
      const snap = snapNear(pageEl, left, top, w, hgt);
      if (snap) { left = snap.left; top = snap.top; }

      const id = ++imageIdRef.current;
      setImages((prev) => [...prev, { id, page: pageEl.dataset.pageKey, src: img.src, left, top, w, h: hgt }]);
      setPendingImage(null);
    };

    // ---- Zapisywanie i otwieranie plików -----------------------------------

    const pageKeysRef = useRef(pageKeys);
    pageKeysRef.current = pageKeys;

    // Czy kronika jest już plikiem na dysku (samą ścieżkę zna main.cpp).
    const [hasFile, setHasFile] = useState(false);
    const hasFileRef = useRef(false);

    // Zawartość z chwili ostatniego zapisu / otwarcia. Na starcie: pusta kronika.
    const baselineRef = useRef(null);
    if (baselineRef.current === null) {
      baselineRef.current = docSnapshot({ pageKeys, boxes: [], images: [] });
    }
    const [dirty, setDirty] = useState(false);   // są zmiany, których nie ma w pliku
    const dirtyRef = useRef(false);
    const fileBusyRef = useRef(false);           // czeka na odpowiedź main.cpp
    const pendingSaveRef = useRef(null);         // { snap, isNew } wysłanego zapisu

    const [openDialogOpen, setOpenDialogOpen] = useState(false);
    const openDialogOpenRef = useRef(false);
    const [closeDialogOpen, setCloseDialogOpen] = useState(false);
    const closeDialogOpenRef = useRef(false);

    // Cała kronika w postaci zapisywanej do pliku. Treść pól z ekranu
    // (stan React bywa nieaktualny podczas pisania).
    const buildDoc = () => ({
      app: FILE_APP,
      version: FILE_VERSION,
      pageKeys: pageKeysRef.current.slice(),
      nextPageNum: nextPageNumRef.current,
      boxes: boxesRef.current.map((b) => {
        const el = boxRefs.current[b.id];
        return {
          id: b.id, page: b.page, left: b.left, top: b.top, width: b.width,
          anchor: b.anchor || null,
          html: cleanBoxHtml(el ? el.innerHTML : b.html),
          ...livePos(b, el)
        };
      }).filter((b) => htmlHasText(b.html)),
      images: imagesRef.current.map((im) => ({
        id: im.id, page: im.page, src: im.src, left: im.left, top: im.top, w: im.w, h: im.h
      }))
    });

    // Porównuje to, co jest na ekranie, z ostatnio zapisaną / otwartą zawartością.
    const checkDirty = () => {
      const d = docSnapshot(buildDoc()) !== baselineRef.current;
      if (d !== dirtyRef.current) {
        dirtyRef.current = d;
        setDirty(d);
      }
      return d;
    };

    const blurEditing = () => {
      const a = document.activeElement;
      if (a && a.isContentEditable) a.blur();
    };

    const anyDialogOpen = () => dialogOpenRef.current || imageDialogOpenRef.current
      || openDialogOpenRef.current || closeDialogOpenRef.current;

    // "Zapisz" / Ctrl+S. Jeszcze nie plik: main.cpp zapyta o miejsce i nazwę.
    // Już plik: zapisuje zmiany, ale tylko jeśli jakieś są.
    const requestSave = () => {
      if (fileBusyRef.current || anyDialogOpen()) return;
      const doc = buildDoc();
      const snap = docSnapshot(doc);
      if (hasFileRef.current && snap === baselineRef.current) return;   // nic do zapisania
      if (!hostPost("save\n" + JSON.stringify(doc))) {
        showToast("Zapisywanie działa tylko w programie Kronika szkolna");
        return;
      }
      fileBusyRef.current = true;
      pendingSaveRef.current = { snap, isNew: !hasFileRef.current };
    };

    const startOpen = () => {
      if (hostPost("open")) fileBusyRef.current = true;
      else showToast("Otwieranie działa tylko w programie Kronika szkolna");
    };

    // "Otwórz": okno z ostrzeżeniem tylko wtedy, gdy coś można stracić.
    const requestOpen = () => {
      if (fileBusyRef.current || anyDialogOpen()) return;
      if (!checkDirty()) { startOpen(); return; }
      blurEditing();
      openDialogOpenRef.current = true;
      setOpenDialogOpen(true);
    };
    const closeOpenDialog = () => {
      openDialogOpenRef.current = false;
      setOpenDialogOpen(false);
    };
    const confirmOpen = () => {
      closeOpenDialog();
      startOpen();
    };

    const closeCloseDialog = () => {
      closeDialogOpenRef.current = false;
      setCloseDialogOpen(false);
    };
    const confirmCloseApp = () => {
      closeCloseDialog();
      hostPost("close");
    };

    // Otwarty plik całkowicie zastępuje obecną kronikę.
    const applyDocument = (doc) => {
      blurEditing();
      setColorPicker(null);
      toolRef.current = TOOL_NONE;
      setTool(TOOL_NONE);
      selectBox(null);
      setPendingImage(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);
      focusIdRef.current = null;
      refocusRef.current = null;
      clipboardRef.current = null;   // skopiowany element należał do poprzedniej kroniki
      freezeBook();

      boxIdRef.current = doc.boxes.reduce((m, b) => Math.max(m, b.id), 0);
      imageIdRef.current = doc.images.reduce((m, im) => Math.max(m, im.id), 0);
      nextPageNumRef.current = doc.nextPageNum;

      setBoxes(doc.boxes);
      setImages(doc.images);
      setPageKeys(doc.pageKeys);
      setPage(0);                    // otwarta kronika zaczyna się od okładki
      setClosing(false);
      setBookVersion((v) => v + 1);

      baselineRef.current = docSnapshot(doc);
      dirtyRef.current = false;
      setDirty(false);
    };

    // Odpowiedzi i polecenia od main.cpp.
    const hostHandlerRef = useRef(null);
    hostHandlerRef.current = (cmd, rest) => {
      if (cmd === "saveShortcut") { requestSave(); return; }

      if (cmd === "saved") {
        fileBusyRef.current = false;
        const p = pendingSaveRef.current;
        pendingSaveRef.current = null;
        if (p) baselineRef.current = p.snap;
        hasFileRef.current = true;
        setHasFile(true);
        checkDirty();
        showToast(p && p.isNew ? "Plik został zapisany" : "Zmiany zostały zapisane");
        return;
      }
      if (cmd === "saveCancelled") { fileBusyRef.current = false; pendingSaveRef.current = null; return; }
      if (cmd === "saveFailed") {
        fileBusyRef.current = false;
        pendingSaveRef.current = null;
        showToast("Nie udało się zapisać pliku");
        return;
      }

      if (cmd === "opened") {
        fileBusyRef.current = false;
        const doc = parseDocument(rest);
        if (!doc) {
          hostPost("openRejected");
          showToast("Nie udało się otworzyć pliku");
          return;
        }
        hostPost("openAccepted");
        applyDocument(doc);
        hasFileRef.current = true;
        setHasFile(true);
        return;
      }
      if (cmd === "openCancelled") { fileBusyRef.current = false; return; }
      if (cmd === "openFailed") {
        fileBusyRef.current = false;
        showToast("Nie udało się otworzyć pliku");
        return;
      }

      // Zamykanie programu: okno tylko wtedy, gdy coś można stracić.
      if (cmd === "confirmClose") {
        if (!checkDirty()) { hostPost("close"); return; }
        hostPost("closeAsked");
        if (closeDialogOpenRef.current) return;
        blurEditing();
        setColorPicker(null);
        closeDeleteDialog();
        closeImageDialog();
        closeOpenDialog();
        closeDialogOpenRef.current = true;
        setCloseDialogOpen(true);
      }
    };

    useEffect(() => {
      const wv = window.chrome && window.chrome.webview;
      if (!wv) return;
      const onMessage = (e) => {
        const msg = typeof e.data === "string" ? e.data : "";
        const nl = msg.indexOf("\n");
        hostHandlerRef.current(nl < 0 ? msg : msg.slice(0, nl), nl < 0 ? "" : msg.slice(nl + 1));
      };
      wv.addEventListener("message", onMessage);
      return () => wv.removeEventListener("message", onMessage);
    }, []);

    // main.cpp musi wiedzieć, czy przy zamykaniu jest coś do stracenia.
    useEffect(() => { hostPost("dirty\n" + (dirty ? "1" : "0")); }, [dirty]);

    // Zmiany w stanie (pola, obrazy, strony)...
    useEffect(() => { checkDirty(); }, [boxes, images, pageKeys]);

    // ...i zmiany robione wprost na ekranie (pisanie, pogrubienie, kolor...),
    // sprawdzane co najwyżej co 150 ms.
    useEffect(() => {
      const target = flipbookContainerRef.current;
      if (!target) return;
      let timer = 0;
      const schedule = () => {
        if (!timer) timer = setTimeout(() => { timer = 0; checkDirty(); }, 150);
      };
      const mo = new MutationObserver(schedule);
      mo.observe(target, {

        curH = hgt;
        curL = sx > 0 ? ax : ax - w;

        if (dialogOpenRef.current || imageDialogOpenRef.current
            || openDialogOpenRef.current || closeDialogOpenRef.current) return;
        if (toolRef.current !== TOOL_MOVE) return;
        if (!e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        if (e.code === "KeyC") {
          e.preventDefault();
          copySelectedBox();
        } else if (e.code === "KeyV") {
          e.preventDefault();
          if (!e.repeat) pasteBox(); // holding the keys doesn't spam copies
        }
      };
      const onMove = (e) => {
        lastPointerRef.current = { x: e.clientX, y: e.clientY, known: true };
      };
      const onOut = (e) => {
        if (!e.relatedTarget) lastPointerRef.current.known = false; // left the window
      };
      // Font size (in page units) of the text at a given position inside a
      // textbox. If the position points between child nodes (e.g. right next
      // to a sized <span>), look at the node there instead of the parent box.
      const sizeAt = (container, offset) => {
        let node = container;
        if (node.nodeType === Node.ELEMENT_NODE) {
          node = node.childNodes[offset] || node.childNodes[offset - 1] || node;
        }
        const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        return Math.round(parseFloat(getComputedStyle(el).fontSize) / unitOf(el));
      };

      const onSelectionChange = () => {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const node = sel.anchorNode;
        const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
        const boxEl = el && el.closest(".textbox");
        if (!boxEl) return; // e.g. focus moved into the font-size input: keep what we saved

        const range = sel.getRangeAt(0);
        const input = boxEl.previousElementSibling;

        // Caret on an empty line (right after a line break, with only another
        // line break or nothing after it): give it a text node to sit in, at
        // that exact spot, so typing there keeps that line's formatting.
        if (range.collapsed && boxEl.isContentEditable
            && range.startContainer.nodeType === Node.ELEMENT_NODE) {
          const parent = range.startContainer;
          const before = parent.childNodes[range.startOffset - 1];
          const after = parent.childNodes[range.startOffset];
          if (before && before.nodeName === "BR" && (!after || after.nodeName === "BR")) {
            const t = document.createTextNode(ZWSP);
            parent.insertBefore(t, after || null);
            const r = document.createRange();
            r.setStart(t, 1);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r); // fires selectionchange again, which does the rest
            return;
          }
        }

        // are still waiting for text: tidy them into one chain and put the
        // caret at its single spot, so the settings never jump around.
        if (boxEl.isContentEditable && pendingFixCount < 5) {
          const cluster = range.collapsed
            ? pendingClusterAt(boxEl, range.startContainer, range.startOffset)
            : pendingClusterIn(boxEl, range);
          if (cluster) {
            const slot = canonicalPendingSlot(cluster);
            const already = sel.isCollapsed && sel.rangeCount
              && sel.getRangeAt(0).startContainer === slot
              && sel.getRangeAt(0).startOffset === slot.length;
            if (!already) {
              pendingFixCount++;
              const r = document.createRange();
              r.setStart(slot, slot.length);
              r.collapse(true);
              sel.removeAllRanges();
              sel.addRange(r); // fires selectionchange again, which does the rest
              return;
            }
