          keepAnchored(boxEl);   // pole mogło się zmniejszyć: wyśrodkuj je znowu
        }

        // the input can be applied at the caret.
        savedRangeRef.current = { boxId: Number(boxEl.dataset.boxId), range: range.cloneRange() };

        if (input) {
          const first = !range.collapsed && textNodesInRange(range)[0];
          input.value = first ? sizeAt(first, 0) : sizeAt(range.startContainer, range.startOffset);
        }
        updateFormatButtons(boxEl);
      };
      window.addEventListener("keydown", onKeyDown, true);
      window.addEventListener("mousemove", onMove, true);
      document.addEventListener("mouseout", onOut, true);
      document.addEventListener("selectionchange", onSelectionChange);
      return () => {
        window.removeEventListener("keydown", onKeyDown, true);
        window.removeEventListener("mousemove", onMove, true);
        document.removeEventListener("mouseout", onOut, true);
        document.removeEventListener("selectionchange", onSelectionChange);
      };
    }, []);

    // Intercept mousemove events at the capture phase to prevent the flipbook
    // from animating hover previews while a tool is active. Since drag listeners
    // are attached to document in capture phase, they fire before this handler
    // and are not affected by stopPropagation.

      const wrap = wrapRef.current;

        // no covers).

          e.preventDefault();
          e.stopPropagation();

          if (pageEl && !pageEl.classList.contains("page-cover")) {
            const pt = e.touches ? e.touches[0] : e;

          return;

        if (e.target.closest(".toggle-btn")) return; // never intercept the tool buttons
        if (e.target.closest(".fontsize-control")) return; // never intercept the fontsize control
        if (e.target.closest(".fontsize-spin")) return;
        if (e.target.closest(".format-btn")) return;
        if (e.target.closest(".font-family-control")) return;

        // focus and selection in the text (and away from the flipbook).

          e.preventDefault();
          e.stopPropagation();
          return;

        // browser's default action where we handle the click ourselves.
        e.stopPropagation();

            const id = Number(handleEl.dataset.imageId);

            startImageResize(id, handleEl.parentElement, handleEl.dataset.corner,

            selectBox(id);
            startBoxDrag(id, point.clientX, point.clientY);
          } else if (imageEl) {
            const id = Number(imageEl.dataset.imageId);
            selectImage(id);
            startImageDrag(id, imageEl, point.clientX, point.clientY);
          } else {
            selectBox(null);
          }
          return;
        }

            e.preventDefault();
            startBoxResize(id, point.clientX, relX < rect.width / 2 ? "left" : "right");
            return;
          }
          if (relX < EDGE_THRESHOLD) {
            e.preventDefault();
            startBoxResize(id, point.clientX, "left");
            return;
          }
          if (relX > rect.width - EDGE_THRESHOLD) {
            e.preventDefault();
            startBoxResize(id, point.clientX, "right");
            return;

          // the box, places the caret, and handles drag / double-click /
          // shift-click selection by itself.
          return;

        const pageEl = e.target.closest(".page, .page-cover");
        if (pageEl) createBoxOnPage(pageEl, point.clientX, point.clientY);

        if (toolRef.current === TOOL_NONE && !pendingImageRef.current) return;
        if (e.target.closest(".toggle-btn")) return;
        if (e.target.closest(".fontsize-control")) return;
        if (e.target.closest(".font-family-control")) return;

        // but don't block drag-selection while in text mode.

      wrap.addEventListener("touchstart", handlePointerDown, true);
      wrap.addEventListener("mousemove", handleMouseMove, true);
      return () => {
        wrap.removeEventListener("mousedown", handlePointerDown, true);
        wrap.removeEventListener("touchstart", handlePointerDown, true);
        wrap.removeEventListener("mousemove", handleMouseMove, true);
      };
    }, []);

    // lewa do tyłu (tak samo decyduje biblioteka).
    useEffect(() => {
      const wrap = wrapRef.current;
      const book = flipbookContainerRef.current;
      if (!wrap || !book) return;
      const onDown = (e) => {
        const p = e.touches ? e.touches[0] : e;
        const r = book.getBoundingClientRect();
        flipDirRef.current = p.clientX >= r.left + r.width / 2 ? "next" : "prev";
      };
      wrap.addEventListener("mousedown", onDown, true);
      wrap.addEventListener("touchstart", onDown, true);
      return () => {
        wrap.removeEventListener("mousedown", onDown, true);
        wrap.removeEventListener("touchstart", onDown, true);

    // the book (see the key below). Debounced, otherwise dragging the window
    // edge would rebuild it on every pixel.
    useEffect(() => {
      let timer = 0;
      const onResize = () => {
        clearTimeout(timer);
        timer = setTimeout(() => {
          const next = computePageSize();
          if (size.w === next.w && size.h === next.h) return;
          // The flipbook key includes size, so a resize is about to remount
          // every textbox node — remember the box being edited (to give it
          // focus back afterwards) and capture all live content first.

          syncBoxesFromDOM();

    useEffect(() => {

      selectBox(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);
    }, [page]);

    const boxesFor = (pageKey) => boxes.filter((b) => b.page === pageKey);

      + (tool === TOOL_TEXT ? " text-mode" : "")
      + (tool === TOOL_MOVE ? " move-mode" : "")
      + (pendingImage ? (pendingImage.loading ? " image-loading" : " image-mode") : "");

      onBoxBlur: pruneIfEmpty,

            visibility: "hidden",
            pointerEvents: "none"

        }),

          ref: flipbookContainerRef,
          className: "flipbook-container hidden",
          style: { width: (size.w * 2) + "px", height: size.h + "px" }
        },

            key: `${size.w}x${size.h}#${bookVersion}`,
            width: size.w, height: size.h, size: "fixed", showCover: SHOW_COVER,
            usePortrait: false,
            useMouseEvents: true,
            startPage: pageRef.current,          // stay on the spread we were reading

            onFlip: (e) => setPage(e.data),
            onChangeOrientation: (e) => setOrientation(e.data),
            onChangeState: (e) => {

          h("div", { className: "toggle-row" },
            h("div", {
              className: "toggle-btn" + (tool === TOOL_TEXT ? " active" : "") + (coverLock ? " disabled" : ""),

            h("div", {
              className: "toggle-btn" + (tool === TOOL_MOVE ? " active" : "") + (coverLock ? " disabled" : ""),

            h("div", {

            // Delete pages: a plain button, never stays selected.

            h("div", {

                        // Wyrównywanie do punktów: działa razem z innymi narzędziami,

              "data-tip": "Wyrównywanie do punktów"
                + (captionOn ? " (niedostępne, gdy włączone jest wyrównywanie tekstu do obrazów)" : coverNote),

            h("div", {

                + (alignOn || coverLock ? " disabled" : ""),

                + (alignOn ? " (niedostępne, gdy włączone jest wyrównywanie do punktów)" : coverNote),

              h("br"),

          h("span", { className: "counter" }, pageLabel(page, total, orientation)),
          h("button", { onClick: () => {

          h("div", {

      h("div", {
        className: "align-bar" + (alignOn && !coverLock ? " visible" : ""),
        // Kliknięcie paska nie zabiera fokusu z edytowanego tekstu.
        onMouseDown: (e) => e.preventDefault()
      },
        ALIGN_LAYOUTS.map((l, i) => h("div", {
          key: i,
          className: "align-option" + (i === alignLayout ? " active" : ""),
          title: l.title,
          onClick: () => setAlignLayout(i)
        }, h(AlignLayoutIcon, { index: i })))
      ),
      colorPicker && h(ColorPicker, {
        key: colorPicker.boxId,
        anchor: colorPicker.anchor,
        current: colorPicker.current,
        onOk: (color) => {
          const apply = colorPicker.onApply;
          setColorPicker(null);
          apply(color);
        },
        onCancel: () => setColorPicker(null)
      })
    );
  }

  createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
