      };
      if (customDots.some((p) => Math.abs(p.x - dot.x) < 1e-6 && Math.abs(p.y - dot.y) < 1e-6)) {
        showToast("W\u00A0tym miejscu jest już kropka");
        return;
      }
      setCustomDots((prev) => [...prev, dot]);
      closeDotDialog();
    };

    // Enter przy otwartym oknie działa tak samo jak przycisk "Dodaj".
    const confirmDotRef = useRef(null);
    confirmDotRef.current = confirmDot;
    useEffect(() => {
      if (!dotDialogOpen) return;
      const onKey = (e) => {
        if (e.key !== "Enter" || e.repeat || e.isComposing) return;
        e.preventDefault();
        confirmDotRef.current();
      };
      window.addEventListener("keydown", onKey, true);
      return () => window.removeEventListener("keydown", onKey, true);
    }, [dotDialogOpen]);

    // ---- Zapis niestandardowego układu kropek ------------------------------
    const layoutBusyRef = useRef(false);     // czeka na odpowiedź main.cpp
    const pendingLayoutRef = useRef(null);   // układ, który ma zostać dopisany do pliku

    const saveCustomLayout = () => {
      if (layoutBusyRef.current || anyDialogOpen()) return;
      if (!customDots.length) {
        showToast("Układ jest pusty. Najpierw dodaj przynajmniej jedną kropkę.");
        return;
      }
      const entry = { name: layoutNameNow(), dots: customDots.map((p) => ({ x: p.x, y: p.y })) };
      // Najpierw aktualna treść pliku; nowy układ dopisuje odpowiedź "layoutsData".
      if (!hostPost("layoutsRead")) {
        showToast("Zapisywanie układów działa tylko w\u00A0programie Kronika szkolna");
        return;
      }
      layoutBusyRef.current = true;
      pendingLayoutRef.current = entry;
    };

    // ---- Okno "Wybierz niestandardowy układ punktów" ------------------------
    const [layoutsDialogOpen, setLayoutsDialogOpen] = useState(false);
    const layoutsDialogOpenRef = useRef(false);
    const [savedLayouts, setSavedLayouts] = useState([]);    // układy z pliku
    const [pickedLayout, setPickedLayout] = useState(null);  // numer klikniętego układu
    // Na co czeka okno: { kind: "list" } albo { kind: "delete", next }.
    const layoutOpRef = useRef(null);

    // Przycisk "Wybierz niestandardowy układ punktów": najpierw aktualna
    // treść pliku; okno otwiera odpowiedź "layoutsData".
    const chooseCustomLayout = () => {
      if (layoutBusyRef.current || anyDialogOpen()) return;
      if (!hostPost("layoutsRead")) {
        showToast("Wybieranie układów działa tylko w\u00A0programie Kronika szkolna");
        return;
      }
      layoutBusyRef.current = true;
      layoutOpRef.current = { kind: "list" };
    };
    const closeLayoutsDialog = () => {
      layoutsDialogOpenRef.current = false;
      setLayoutsDialogOpen(false);
    };

    // "Usuń": plik zapisywany od nowa, już bez klikniętego układu.
    const deletePickedLayout = () => {
      if (!layoutsDialogOpenRef.current || layoutBusyRef.current) return;
      if (pickedLayout === null || !savedLayouts[pickedLayout]) return;
      const next = savedLayouts.filter((_, i) => i !== pickedLayout);
      if (!hostPost("layoutsWrite\n" + JSON.stringify(
            { app: FILE_APP, type: LAYOUTS_TYPE, version: 1, layouts: next }, null, 2))) return;
      layoutBusyRef.current = true;
      layoutOpRef.current = { kind: "delete", next };
    };

    // "Wybierz" albo podwójne kliknięcie układu: jego kropki zastępują
    // obecne niestandardowe kropki.
    const confirmPickedLayout = (index = pickedLayout) => {
      if (!layoutsDialogOpenRef.current || layoutBusyRef.current) return;
      const l = index === null ? null : savedLayouts[index];
      if (!l) return;
      setCustomDots(l.dots.map((p) => ({ x: p.x, y: p.y })));
      closeLayoutsDialog();
    };

    // Przyciąganie do kropki, tylko gdy narzędzie jest włączone.
    // Wszystkie wartości to ułamki strony.
    const snapNear = (pageEl, left, top, wf, hf) => {
      const a = alignRef.current;
      return a.on ? snapToDot(pageEl, a.points, left, top, wf, hf) : null;
    };
    // Przyciąganie pierwszej linii tekstu do kropki pod obrazem, tylko gdy
    // narzędzie jest włączone. Tylko teksty tego używają (obrazy nie).
    const snapCaption = (pageEl, cx, cy, offX, offY, boxW, boxH) => {
      if (!captionRef.current || !pageEl) return null;
      const key = pageEl.dataset.pageKey;
      const imgs = imagesRef.current.filter((im) => im.page === key);
      return snapToCaption(pageEl, imgs, cx, cy, offX, offY, boxW, boxH);
    };

    // Aktualne położenie pola wyśrodkowanego na kropce, odczytane z ekranu
    // (podczas pisania przesuwa się ono bez zmiany stanu React).
    const livePos = (b, el) => {
      if (!b.anchor || !el) return {};
      const wrapper = el.parentElement;
      const pageEl = wrapper && wrapper.parentElement;
      if (!pageEl || !pageEl.offsetWidth || !pageEl.offsetHeight) return {};
      return {
        left: wrapper.offsetLeft / pageEl.offsetWidth,
        top:  wrapper.offsetTop / pageEl.offsetHeight
      };
    };

    const commitBoxPos = (id, el) => {
      const b = boxesRef.current.find((x) => x.id === id);
      if (!b || !b.anchor) return;
      keepAnchored(el);   // najpierw wyśrodkuj (rozmiar mógł się właśnie zmienić)
      const pos = livePos(b, el);
      if (pos.left === undefined) return;
      setBoxes((prev) => prev.map((x) => x.id === id ? { ...x, ...pos } : x));
    };
	
    // Po przesunięciu / zmianie rozmiaru obrazu: zapisz w stanie nowe
    // położenie podpisów przyklejonych do niego (na ekranie już się przesunęły).
    const commitImageFollowers = (imageId) => {
      const updates = {};
      boxesRef.current.forEach((b) => {
        if (!b.anchor || b.anchor.imageId !== imageId) return;
        const el = boxRefs.current[b.id];
        if (!el) return;
        const pos = livePos(b, el);
        if (pos.left === undefined) return;
        updates[b.id] = {
          ...pos,
          anchor: { ...b.anchor, x: parseFloat(el.dataset.anchorX), y: parseFloat(el.dataset.anchorY) }
        };
      });
      if (!Object.keys(updates).length) return;
      setBoxes((prev) => prev.map((b) => updates[b.id] ? { ...b, ...updates[b.id] } : b));
    };

    // Pictures on pages: { id, page, src, left, top, w, h } (fractions of the page).
    const [images, setImages] = useState([]);
    // Mirrors `images` for the native listeners (attached once).
    const imagesRef = useRef([]);
    imagesRef.current = images;
    const imageIdRef = useRef(0);
    // Kolejność warstw: większe z = wyżej. Każdy nowy element i każdy element
    // przesunięty / zmieniony w trybie przesuwania (z: null) dostaje najwyższe.
    const zRef = useRef(0);
    React.useLayoutEffect(() => {
      const give = (list, set) => {
        if (!list.some((x) => x.z == null)) return;
        set((prev) => prev.map((x) => (x.z == null ? { ...x, z: ++zRef.current } : x)));
      };
      give(images, setImages);
      give(boxes, setBoxes);
    }, [boxes, images]);
    // "Dodaj obraz" window. The ref is for the native listeners (attached once).
    const [imageDialogOpen, setImageDialogOpen] = useState(false);
    const imageDialogOpenRef = useRef(false);
    const imageInputRef = useRef(null);
    // Bumped whenever the window opens/closes or the waiting picture is
    // cancelled, so a file that finishes loading afterwards is ignored.
    const imageLoadTokenRef = useRef(0);

    // The chosen picture waiting for a click on a page: { src, w, h },
    // { loading: true } while the file is still being read, or null.
    // Used exactly once, then forgotten.
    const [pendingImage, setPendingImageState] = useState(null);
    const pendingImageRef = useRef(null);
    // A click on a page made while the picture was still loading: it gets
    // placed there as soon as the picture is ready.
    const queuedPlaceRef = useRef(null);
    // null also cancels a picture that is still loading in the background.
    const setPendingImage = (img) => {
      if (!img) {
        imageLoadTokenRef.current++;
        queuedPlaceRef.current = null;
      }
      pendingImageRef.current = img;
      setPendingImageState(img);
    };

    // Clicking the color button opens the panel; clicking it again closes it.
    const openColorPicker = (boxId, rect, current, onApply) => {
      setColorPicker((prev) => prev && prev.boxId === boxId ? null : {
        boxId,
        anchor: { left: rect.left, top: rect.top, bottom: rect.bottom },
        current,
        onApply
      });
    };

    // Any click outside the panel (and outside a color button) only closes
    // it: the click itself is swallowed, so it can't create a new text box,
    // press a button, flip a page or move the caret.
    useEffect(() => {
      if (!colorPicker) return;
      const onDown = (e) => {
        const t = e.target;
        if (t.closest && (t.closest(".color-picker") || t.closest(".format-color"))) return;

        e.preventDefault();   // keep focus and selection in the text
        e.stopPropagation();  // never reaches the page, toolbar or flipbook

        // The "click" that follows this press must not do anything either
        // (buttons like "Następna ▶" or the tool buttons react to it).
        const swallowClick = (ev) => { ev.preventDefault(); ev.stopPropagation(); };
        window.addEventListener("click", swallowClick, true);
        window.addEventListener("mouseup", () => {
          setTimeout(() => window.removeEventListener("click", swallowClick, true), 0);
        }, { capture: true, once: true });

        setColorPicker(null);
      };
      const onResize = () => setColorPicker(null);
      document.addEventListener("mousedown", onDown, true);
      window.addEventListener("resize", onResize);
      // Przewinięcie książki: przycisk koloru odjeżdża, panel się zamyka.
      const sc = scrollerRef.current;
      if (sc) sc.addEventListener("scroll", onResize);
      return () => {
        document.removeEventListener("mousedown", onDown, true);
        window.removeEventListener("resize", onResize);
        if (sc) sc.removeEventListener("scroll", onResize);
      };
    }, [colorPicker]);

    // Remove the placeholder spacer after the first render cycle completes
    useEffect(() => {
      const timer = setTimeout(() => setBookReady(true), 0);
      return () => clearTimeout(timer);
    }, []);

    // Hide the flipbook until it's fully initialized, then fade it in
    useEffect(() => {
      if (!bookReady || !bookRef.current) return;

      // Wait a frame to ensure the page-flip library has fully rendered all pages
      const timer = setTimeout(() => {
        if (flipbookContainerRef.current) {
          flipbookContainerRef.current.classList.remove('hidden');
        }
      }, 16);

      return () => clearTimeout(timer);
    }, [bookReady, bookRef.current]);

    // Check if current page is a cover (front or back)
    const isCurrentPageCover = () => page === 0 || page > pageKeys.length;
    // Książka właśnie się zamyka (przewracanie, które skończy się na okładce).
    const [closing, setClosing] = useState(false);
    // Kierunek ostatnio rozpoczętego przewracania: "next" albo "prev".
    const flipDirRef = useRef("next");
    // Okładka albo zamykanie książki: narzędzia blokują się,
    // a podpowiedzi chowają od razu.
    const coverLock = isCurrentPageCover() || closing;
    const hideHints = coverLock;
    const syncBoxesFromDOM = () => {
      setBoxes((prev) => prev.map((b) => {
        const el = boxRefs.current[b.id];
        return el ? { ...b, html: el.innerHTML, ...livePos(b, el) } : b;
      }));
    };

    // Before the book is rebuilt for a new page size: remember which text
    // box is being edited and where its caret / selection is.
    const rememberFocusedBox = () => {
      refocusRef.current = null;
      const a = document.activeElement;
      if (!a || !a.classList || !a.classList.contains("textbox") || !a.isContentEditable) return;
      let start = Infinity, end = Infinity;   // no selection: caret at the end
      const sel = window.getSelection();
      if (sel.rangeCount && a.contains(sel.anchorNode)) {
        const r = sel.getRangeAt(0);
        start = offsetIn(a, r.startContainer, r.startOffset);
        end = offsetIn(a, r.endContainer, r.endOffset);
      }
      refocusRef.current = { boxId: Number(a.dataset.boxId), start, end };
    };

    // A box only "counts" once it has text in it. Called on blur, and when
    // a tool is switched off/away while a box is still focused, so an empty
    // box a user clicked into (but never typed in) never lingers on the page.
    const pruneIfEmpty = (id) => {
      const el = boxRefs.current[id];
      if (!boxHasText(el)) {
        setBoxes((prev) => prev.filter((b) => b.id !== id));
        delete boxRefs.current[id];
      }
    };

    // Remove every currently-tracked box that has no text in it. Used
    // instead of "find the one box that's still focused" whenever we leave
    // text mode — chasing document.activeElement doesn't work reliably
    // here because the toggle buttons use `user-select: none`, which stops
    // the browser from blurring a focused contentEditable on mousedown in
    // the first place. This sweep has no dependency on focus timing at all:
    // it just checks every box's actual content.
    const pruneAllEmpty = () => {
      setBoxes((prev) => prev.filter((b) => {
        const hasText = boxHasText(boxRefs.current[b.id]);
        if (!hasText) delete boxRefs.current[b.id];
        return hasText;
      }));
    };

    const selectTool = (next) => {
      const wasTextEditing = toolRef.current === TOOL_TEXT;
      const resolved = toolRef.current === next ? TOOL_NONE : next; // click active tool again to turn it off

      // Blur whatever's currently focused so its latest content is
      // committed to the DOM before pruneAllEmpty reads it below.
      const current = document.activeElement;
      if (current && (current.isContentEditable || current.classList.contains("dim-input"))) current.blur();
      toolRef.current = resolved;
      setTool(resolved);
      selectBox(null);
      setPendingImage(null);        // another tool: forget a picture waiting to be placed
      savedRangeRef.current = null;
      setFragmentHighlight(null);
      if (wasTextEditing && resolved !== TOOL_TEXT) {
        pruneAllEmpty();
      }
    };

    const toggleTextMode = () => {
      if (coverLock) return;
      selectTool(TOOL_TEXT);
    };
    const toggleMoveMode = () => {
      if (coverLock) return;
      selectTool(TOOL_MOVE);
    };
    // ---- Delete the currently displayed spread -----------------------------

    const openDeleteDialog = () => {
      if (coverLock || dialogOpenRef.current) return;

      // Commit whatever is being typed and drop any selection first.
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      selectBox(null);
      setPendingImage(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);
      setDialogPages(`${page + 1}–${page + 2}`);
      dialogOpenRef.current = true;
      setDialogOpen(true);
    };

    const closeDeleteDialog = () => {
      dialogOpenRef.current = false;
      setDialogOpen(false);
    };

    const deleteCurrentSpread = () => {
      closeDeleteDialog();

      // `page` is the flipbook index of the spread's left page; inner page
      // keys are offset by one because index 0 is the front cover.
      if (page < 1 || page + 1 > pageKeys.length) return;
      freezeBook();
      const removed = new Set([pageKeys[page - 1], pageKeys[page]]);
      const remaining = pageKeys.filter((k) => !removed.has(k));

      // Stay on the same spread position (the following pages slide in);
      // if the last spread was deleted, go back one; if nothing is left,
      // show the front cover (pages can be added back from there).
      let next = page;
      if (next > remaining.length) next = remaining.length - 1;
      if (next < 1) next = 0;

      // The remount recreates every textbox node, so capture live content
      // first, and drop the boxes that lived on the deleted pages.
      setBoxes((prev) => prev
        .map((b) => {
          const el = boxRefs.current[b.id];
          return el ? { ...b, html: el.innerHTML } : b;
        })
        .filter((b) => {
          if (!removed.has(b.page)) return true;
          delete boxRefs.current[b.id];
          return false;
        })
      );

      // Pictures on the deleted pages go too.
      setImages((prev) => prev.filter((im) => !removed.has(im.page)));
      // Tools can't be active on a cover.
      if (next === 0) {
        toolRef.current = TOOL_NONE;
        setTool(TOOL_NONE);
      }

      setPageKeys(remaining);
      setPage(next);                 // also feeds startPage via pageRef
      setBookVersion((v) => v + 1);  // remount the book with the new pages
      showToast("Usunięto dwie strony");
	};
	
    const addPages = () => {
      if (dialogOpenRef.current) return;
      // Okładka: niedostępne, chyba że książka nie ma już żadnych stron.
      if (coverLock && pageKeys.length > 0) return;
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      freezeBook();
      selectBox(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);

      // `page` is the flipbook index of the spread's left page. Inner page
      // keys are offset by one (index 0 is the front cover), so the spread's
      // right page is pageKeys[page].
      let insertAt;
      if (page === 0) insertAt = 0;
      else if (page > pageKeys.length) insertAt = pageKeys.length;
      else insertAt = page + 1;

      const newKeys = [
        `p${nextPageNumRef.current++}`,
        `p${nextPageNumRef.current++}`
      ];

      // The remount recreates every textbox node, so capture live content
      // first, and drop any box that was clicked into but never typed in.
      setBoxes((prev) => prev
        .map((b) => {
          const el = boxRefs.current[b.id];
          return el ? { ...b, html: el.innerHTML } : b;
        })
        .filter((b) => {
          if (boxHasText(boxRefs.current[b.id])) return true;
          delete boxRefs.current[b.id];
          return false;
        })
      );

      setPageKeys((prev) => [...prev.slice(0, insertAt), ...newKeys, ...prev.slice(insertAt)]);
      setBookVersion((v) => v + 1);  // remount the book with the new pages
      // `page` is unchanged, so startPage (via pageRef) keeps the current
      // position. On the back cover that position now shows the new pages.
      showToast("Dodano dwie strony");
    };

    // ---- Add an image ----------------------------------------------------------

    const openImageDialog = () => {
      if (dialogOpenRef.current || imageDialogOpenRef.current) return;
      if (coverLock) return;
      // Commit whatever is being typed; no tool stays active.
      const current = document.activeElement;
      if (current && current.isContentEditable) current.blur();
      if (toolRef.current === TOOL_TEXT) pruneAllEmpty();
      toolRef.current = TOOL_NONE;
      setTool(TOOL_NONE);
      selectBox(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);

      setPendingImage(null);   // always start from the beginning
      imageLoadTokenRef.current++;
      imageDialogOpenRef.current = true;
      setImageDialogOpen(true);
    };

    const closeImageDialog = () => {
      imageLoadTokenRef.current++;
      imageDialogOpenRef.current = false;
      setImageDialogOpen(false);
    };

    // "Wybierz plik…": the normal Windows file picker, one file only.
    const chooseImageFile = () => {
      const input = imageInputRef.current;
      if (!input) return;
      input.value = "";
      input.click();
    };

    const onImageFileChosen = (e) => {
      const file = e.target.files && e.target.files[0];
      e.target.value = "";  // the app never remembers a chosen file
      if (!file || !imageDialogOpenRef.current) return;

      if (!IMAGE_EXT_RE.test(file.name)) {
        showToast("Wybrany plik nie jest obrazem");
        return;             // the window stays open: choose again or "Anuluj"
      }

      // Close the window right away; the picture loads in the background.
      closeImageDialog();
      const token = imageLoadTokenRef.current;
      setPendingImage({ loading: true });

      const failed = () => {
        if (token !== imageLoadTokenRef.current) return;
        setPendingImage(null);
        showToast("Nie udało się otworzyć obrazu");
      };
      const reader = new FileReader();
      reader.onerror = failed;
      reader.onload = () => {
        if (token !== imageLoadTokenRef.current) return;  // cancelled meanwhile
        const src = reader.result;
        const probe = new Image();
        probe.onerror = failed;
        probe.onload = () => {
          if (token !== imageLoadTokenRef.current) return;
          setPendingImage({
            src: shrinkImageSrc(probe, src),
            w: probe.naturalWidth || 200,   // some SVGs have no size of their own
            h: probe.naturalHeight || 200
          });
          // The user already clicked a page while it was loading: place it there.
          const q = queuedPlaceRef.current;
          queuedPlaceRef.current = null;
          if (q && q.pageEl.isConnected) placeImageAt(q.pageEl, q.fx, q.fy);
        };
        probe.src = src;
      };
      reader.readAsDataURL(file);   // stored inside the app, not as a link to the file
    };

    // A click on a page while a picture is waiting (or still loading). The
    // position is stored as a fraction of the page, so it stays valid even
    // if the page moves before the picture is ready.
    const placeImage = (pageEl, clientX, clientY) => {
      const img = pendingImageRef.current;
      if (!img) return;
      const rect = pageEl.getBoundingClientRect();
      if (!rect.width || !rect.height) return;   // page not on screen
      const fx = (clientX - rect.left) / rect.width;
      const fy = (clientY - rect.top) / rect.height;
      if (img.loading) {
        // Not ready yet: remember the click (the last one wins).
        queuedPlaceRef.current = { pageEl, fx, fy };
        return;
      }
      placeImageAt(pageEl, fx, fy);
    };

    // Put the waiting picture on an inner page, centered on the given point
    // (fractions of the page) and kept inside the page. One picture per choice.
    const placeImageAt = (pageEl, fx, fy) => {
      const img = pendingImageRef.current;
      if (!img || img.loading) return;

      const pageW = pageEl.offsetWidth, pageH = pageEl.offsetHeight;
      if (!pageW || !pageH) return;   // page hidden (flipped away): keep waiting

      // At most MAX_IMAGE_PART of the page; small pictures are not blown up
      // (one picture pixel = one page unit, same as text sizes).
      const scale = Math.min(
        MAX_IMAGE_PART * pageW / img.w,
        MAX_IMAGE_PART * pageH / img.h,
        pageW / REF_PAGE_W
      );
      const w = img.w * scale / pageW;
      const hgt = img.h * scale / pageH;

      const maxLeft = Math.max(pageEl.clientWidth / pageW - w, 0);
      const maxTop  = Math.max(pageEl.clientHeight / pageH - hgt, 0);
      let left = Math.min(Math.max(fx - w / 2, 0), maxLeft);
      let top  = Math.min(Math.max(fy - hgt / 2, 0), maxTop);
      // Narzędzie wyrównywania: obok kropki środek obrazu ląduje na niej.
      const snap = snapNear(pageEl, left, top, w, hgt);
      if (snap) { left = snap.left; top = snap.top; }

      const id = ++imageIdRef.current;
      setImages((prev) => [...prev, { id, page: pageEl.dataset.pageKey, src: img.src, left, top, w, h: hgt }]);
      setPendingImage(null);
    };

    // ---- Zapisywanie i otwieranie plików -----------------------------------

    const pageKeysRef = useRef(pageKeys);
    pageKeysRef.current = pageKeys;

    // Czy kronika jest już plikiem na dysku (samą ścieżkę zna main.cpp).
    const [hasFile, setHasFile] = useState(false);
    const hasFileRef = useRef(false);

    // Zawartość z chwili ostatniego zapisu / otwarcia. Na starcie: pusta kronika.
    const baselineRef = useRef(null);
    if (baselineRef.current === null) {
      baselineRef.current = docSnapshot({ pageKeys, boxes: [], images: [] });
    }
    const [dirty, setDirty] = useState(false);   // są zmiany, których nie ma w pliku
    const dirtyRef = useRef(false);
    const fileBusyRef = useRef(false);           // czeka na odpowiedź main.cpp
    const pendingSaveRef = useRef(null);         // { snap, isNew } wysłanego zapisu

    const [openDialogOpen, setOpenDialogOpen] = useState(false);
    const openDialogOpenRef = useRef(false);
    const [closeDialogOpen, setCloseDialogOpen] = useState(false);
    const closeDialogOpenRef = useRef(false);

    const [newDialogOpen, setNewDialogOpen] = useState(false);
    const newDialogOpenRef = useRef(false);

    const buildDoc = () => ({
      app: FILE_APP,
      version: FILE_VERSION,
      pageKeys: pageKeysRef.current.slice(),
      nextPageNum: nextPageNumRef.current,
      boxes: boxesRef.current.map((b) => {
        const el = boxRefs.current[b.id];
        return {
          id: b.id, page: b.page, left: b.left, top: b.top, width: b.width,
          anchor: b.anchor || null,
          html: cleanBoxHtml(el ? el.innerHTML : b.html),
          z: b.z ?? null,
          ...livePos(b, el)
        };
      }).filter((b) => htmlHasText(b.html)),
      images: imagesRef.current.map((im) => ({
        id: im.id, page: im.page, src: im.src, left: im.left, top: im.top, w: im.w, h: im.h, z: im.z ?? null
      })),
    });

    // Porównuje to, co jest na ekranie, z ostatnio zapisaną / otwartą zawartością.
    const checkDirty = () => {
      const d = docSnapshot(buildDoc()) !== baselineRef.current;
      if (d !== dirtyRef.current) {
        dirtyRef.current = d;
        setDirty(d);
      }
      return d;
    };

    const blurEditing = () => {
      const a = document.activeElement;
      if (a && a.isContentEditable) a.blur();
    };

    const anyDialogOpen = () => dialogOpenRef.current || imageDialogOpenRef.current
      || openDialogOpenRef.current || closeDialogOpenRef.current || dotDialogOpenRef.current
      || layoutsDialogOpenRef.current || newDialogOpenRef.current
      || removeDotsDialogOpenRef.current;

    const requestSave = () => {
      if (fileBusyRef.current || anyDialogOpen()) return;
      // Najpierw zatwierdź wymiar / obrót, który jest właśnie wpisywany.
      const ae = document.activeElement;
      if (ae && ae.classList && ae.classList.contains("dim-input")) ae.blur();
      const doc = buildDoc();
      const snap = docSnapshot(doc);
      if (hasFileRef.current && snap === baselineRef.current) return;   // nic do zapisania
      let sent;
      try {
        sent = hostPost("save\n" + JSON.stringify(doc));
      } catch (e) {
        showToast("Nie udało się zapisać pliku: kronika jest zbyt duża");
        return;
      }
      if (!sent) {
        showToast("Zapisywanie działa tylko w\u00A0programie Kronika szkolna");
        return;
      }
      fileBusyRef.current = true;
      pendingSaveRef.current = { snap, isNew: !hasFileRef.current };
    };

    // "Zapisz jako": zawsze pyta o miejsce i nazwę, zawsze powstaje nowy plik.
    const requestSaveAs = () => {
      if (fileBusyRef.current || anyDialogOpen()) return;
      const ae = document.activeElement;
      if (ae && ae.classList && ae.classList.contains("dim-input")) ae.blur();
      const doc = buildDoc();
      let sent;
      try {
        sent = hostPost("saveAs\n" + JSON.stringify(doc));
      } catch (e) {
        showToast("Nie udało się zapisać pliku: kronika jest zbyt duża");
        return;
      }
      if (!sent) {
        showToast("Zapisywanie działa tylko w\u00A0programie Kronika szkolna");
        return;
      }
      fileBusyRef.current = true;
      pendingSaveRef.current = { snap: docSnapshot(doc), isNew: true };
    };

    // cmd: "open" (okno wyboru pliku) albo "openPending" (plik z Eksploratora).
    const startOpen = (cmd = "open") => {
      if (hostPost(cmd)) fileBusyRef.current = true;
      else showToast("Otwieranie działa tylko w\u00A0programie Kronika szkolna");
    };

    // Polecenie, którym otworzy się plik po potwierdzeniu w oknie ostrzeżenia.
    const openCmdRef = useRef("open");

    // "Otwórz" albo dwuklik pliku w Eksploratorze (external === true):
    // okno z ostrzeżeniem tylko wtedy, gdy coś można stracić.
    const requestOpen = (external) => {
      const cmd = external === true ? "openPending" : "open";
      if (fileBusyRef.current || anyDialogOpen()) {
        if (cmd === "openPending") showToast("Zamknij otwarte okno i\u00A0otwórz plik jeszcze raz");
        return;
      }
      if (!checkDirty()) { startOpen(cmd); return; }
      blurEditing();
      setColorPicker(null);
      openCmdRef.current = cmd;
      openDialogOpenRef.current = true;
      setOpenDialogOpen(true);
    };
    const closeOpenDialog = () => {
      openDialogOpenRef.current = false;
      setOpenDialogOpen(false);
    };
    const confirmOpen = () => {
      const cmd = openCmdRef.current;
      openCmdRef.current = "open";
      closeOpenDialog();
      startOpen(cmd);
    };

    // "Utwórz wersję tylko do przeglądania": program pyta o plik kroniki,
    // strona go sprawdza ("exportCheck"), potem program pyta o miejsce zapisu
    // i tworzy plik. Kronika na ekranie nie bierze w tym udziału.
    const requestExport = () => {
      if (fileBusyRef.current || anyDialogOpen()) return;
      if (hostPost("export")) fileBusyRef.current = true;
      else showToast("Tworzenie wersji do przeglądania działa tylko w\u00A0programie Kronika szkolna");
    };

    const closeCloseDialog = () => {
      closeDialogOpenRef.current = false;
      setCloseDialogOpen(false);
    };
    const confirmCloseApp = () => {
      closeCloseDialog();
      hostPost("close");
    };

    // Otwarty plik całkowicie zastępuje obecną kronikę.
    const applyDocument = (doc) => {
      blurEditing();
      setColorPicker(null);
      toolRef.current = TOOL_NONE;
      setTool(TOOL_NONE);
      selectBox(null);
      setPendingImage(null);
      savedRangeRef.current = null;
      setFragmentHighlight(null);
      focusIdRef.current = null;
      refocusRef.current = null;
      clipboardRef.current = null;   // skopiowany element należał do poprzedniej kroniki
      freezeBook();

      boxIdRef.current = doc.boxes.reduce((m, b) => Math.max(m, b.id), 0);
      imageIdRef.current = doc.images.reduce((m, im) => Math.max(m, im.id), 0);
      zRef.current = [...doc.images, ...doc.boxes].reduce((m, x) => Math.max(m, x.z || 0), 0);
      nextPageNumRef.current = doc.nextPageNum;

      setBoxes(doc.boxes);
      setImages(doc.images);
      setPageKeys(doc.pageKeys);
      setPage(0);                    // otwarta kronika zaczyna się od okładki
      setClosing(false);
      setBookVersion((v) => v + 1);

      baselineRef.current = docSnapshot(doc);
      dirtyRef.current = false;
      setDirty(false);
    };

    // Nowa, pusta kronika: taka sama jak po uruchomieniu programu.
    const startNew = () => {
      hostPost("newDoc");   // program zapomina plik poprzedniej kroniki
      applyDocument({
        pageKeys: Array.from({ length: INITIAL_INNER_PAGES }, (_, i) => `p${i + 1}`),
        nextPageNum: INITIAL_INNER_PAGES + 1,
        boxes: [], images: []
      });
      hasFileRef.current = false;
      setHasFile(false);
      // Narzędzia wyrównywania wyłączone, jak po uruchomieniu.
      setAlignOn(false);
      setCaptionOn(false);
      setCustomDots([]);
    };

    // "Nowa kronika": okno z ostrzeżeniem tylko wtedy, gdy coś można stracić
    // (to samo sprawdzenie co przy zamykaniu programu).
    const requestNew = () => {
      if (fileBusyRef.current || anyDialogOpen()) return;
      if (!checkDirty()) { startNew(); return; }
      blurEditing();
      setColorPicker(null);
      newDialogOpenRef.current = true;
      setNewDialogOpen(true);
    };
    const closeNewDialog = () => {
      newDialogOpenRef.current = false;
      setNewDialogOpen(false);
    };
    const confirmNew = () => {
      closeNewDialog();
      startNew();
    };

    // Odpowiedzi i polecenia od main.cpp.
    const hostHandlerRef = useRef(null);
    hostHandlerRef.current = (cmd, rest) => {
      // Wersja tylko do przeglądania: program przysyła jedynie treść kroniki.
      if (VIEWER) {
        if (cmd === "viewerDoc") {
          const doc = parseDocument(rest);
          if (doc) applyDocument(doc);
          else showToast("Nie udało się wczytać kroniki");
        }
        return;
      }
      if (cmd === "saveShortcut") { requestSave(); return; }
      if (cmd === "externalOpen") { requestOpen(true); return; }

      // Okno wyboru zapisanego układu: lista z pliku i usuwanie układu.
      const op = layoutOpRef.current;
      if (op && (cmd === "layoutsData" || cmd === "layoutsReadFailed"
              || cmd === "layoutsWritten" || cmd === "layoutsWriteFailed")) {
        layoutBusyRef.current = false;
        layoutOpRef.current = null;
        if (cmd === "layoutsData") {
          const list = parseLayouts(rest);
          if (!list) {
            // Plik nie jest plikiem układów: program go odkłada i zaczyna od pustej listy.
            hostPost("layoutsSetAside");
            showToast("Plik z\u00A0układami punktów był uszkodzony. Lista układów jest teraz pusta.");
            return;
          }
          if (anyDialogOpen()) return;       // w międzyczasie otworzyło się inne okno
          blurEditing();
          setSavedLayouts(list);
          setPickedLayout(null);             // nic nie jest jeszcze kliknięte
          layoutsDialogOpenRef.current = true;
          setLayoutsDialogOpen(true);
        } else if (cmd === "layoutsWritten") {
          setSavedLayouts(op.next);
          setPickedLayout(null);
          showToast("Usunięto niestandardowy układ punktów");
        } else {
          showToast(cmd === "layoutsReadFailed"
            ? "Nie udało się wczytać układów punktów"
            : "Nie udało się usunąć układu punktów");
        }
        return;
      }

      // Zapis niestandardowego układu kropek (plik obok app.exe).
      if (cmd === "layoutsData") {
        const entry = pendingLayoutRef.current;
        if (!entry) { layoutBusyRef.current = false; return; }
        let list = parseLayouts(rest);
        if (!list) {
          // Uszkodzony plik: program go odkłada, nowy układ trafia do pustej listy.
          hostPost("layoutsSetAside");
          list = [];
        }
        // Dwa zapisy w tej samej sekundzie miałyby tę samą nazwę.
        if (list.some((l) => l.name === entry.name)) {
          layoutBusyRef.current = false;
          pendingLayoutRef.current = null;
          showToast("Ten układ punktów jest już zapisany");
          return;
        }
        hostPost("layoutsWrite\n" + JSON.stringify(
          { app: FILE_APP, type: LAYOUTS_TYPE, version: 1, layouts: [...list, entry] }, null, 2));
        return;
      }
      if (cmd === "layoutsWritten") {
        layoutBusyRef.current = false;
        pendingLayoutRef.current = null;
        showToast("Zapisano niestandardowy układ punktów");
        return;
      }
      if (cmd === "layoutsReadFailed" || cmd === "layoutsWriteFailed") {
        layoutBusyRef.current = false;
        pendingLayoutRef.current = null;
        showToast("Nie udało się zapisać układu punktów");
        return;
      }

      if (cmd === "saved") {
        fileBusyRef.current = false;
        const p = pendingSaveRef.current;
        pendingSaveRef.current = null;
        if (p) baselineRef.current = p.snap;
        hasFileRef.current = true;
        setHasFile(true);
        checkDirty();
        showToast(p && p.isNew ? "Plik został zapisany" : "Zmiany zostały zapisane");
        return;
      }
      if (cmd === "saveCancelled") { fileBusyRef.current = false; pendingSaveRef.current = null; return; }
      if (cmd === "saveFailed") {
        fileBusyRef.current = false;
        pendingSaveRef.current = null;
        showToast("Nie udało się zapisać pliku");
        return;
      }

      if (cmd === "opened") {
        fileBusyRef.current = false;
        const doc = parseDocument(rest);
        if (!doc) {
          hostPost("openRejected");
          showToast("Nie udało się otworzyć pliku");
          return;
        }
        hostPost("openAccepted");
        applyDocument(doc);
        hasFileRef.current = true;
        setHasFile(true);
        return;
      }
      if (cmd === "openCancelled") { fileBusyRef.current = false; return; }
      if (cmd === "openFailed") {
        fileBusyRef.current = false;
        showToast("Nie udało się otworzyć pliku");
        return;
      }

      // Tworzenie wersji tylko do przeglądania.
      if (cmd === "exportCheck") {
        // Wybrany plik jest sprawdzany tak samo jak przy otwieraniu.
        if (parseDocument(rest)) {
          hostPost("exportAccepted");        // program pyta teraz o miejsce zapisu
        } else {
          fileBusyRef.current = false;
          hostPost("exportRejected");
          showToast("Wybrany plik nie jest plikiem kroniki");
        }
        return;
      }
      if (cmd === "exported") {
        fileBusyRef.current = false;
        showToast("Utworzono wersję tylko do przeglądania");
        return;
      }
      if (cmd === "exportCancelled") { fileBusyRef.current = false; return; }
      if (cmd === "exportReadFailed") {
        fileBusyRef.current = false;
        showToast("Nie udało się otworzyć pliku");
        return;
      }
      if (cmd === "exportFailed") {
        fileBusyRef.current = false;
        showToast("Nie udało się utworzyć pliku");
        return;
      }

      // Zamykanie programu: okno tylko wtedy, gdy coś można stracić.
      if (cmd === "confirmClose") {
        if (!checkDirty()) { hostPost("close"); return; }
        hostPost("closeAsked");
        if (closeDialogOpenRef.current) return;
        blurEditing();
        setColorPicker(null);
        closeDeleteDialog();
        closeImageDialog();
        closeOpenDialog();
        closeNewDialog();
        closeDotDialog();
		closeLayoutsDialog();
        closeRemoveDotsDialog();
        closeDialogOpenRef.current = true;
        setCloseDialogOpen(true);
      }
    };

    useEffect(() => {
      const wv = window.chrome && window.chrome.webview;
      if (!wv) return;
      const onMessage = (e) => {
        const msg = typeof e.data === "string" ? e.data : "";
        const nl = msg.indexOf("\n");
        hostHandlerRef.current(nl < 0 ? msg : msg.slice(0, nl), nl < 0 ? "" : msg.slice(nl + 1));
      };
      wv.addEventListener("message", onMessage);
      // Wersja tylko do przeglądania: strona jest gotowa, prosi o swoją kronikę.
      // Wersja tylko do przeglądania prosi o swoją kronikę; zwykła mówi
      // programowi, że jest gotowa (może czekać plik otwarty z Eksploratora).
      wv.postMessage(VIEWER ? "viewerReady" : "pageReady");
      return () => wv.removeEventListener("message", onMessage);
    }, []);

    // main.cpp musi wiedzieć, czy przy zamykaniu jest coś do stracenia.
    useEffect(() => { hostPost("dirty\n" + (dirty ? "1" : "0")); }, [dirty]);

    useEffect(() => { checkDirty(); }, [boxes, images, pageKeys]);

    // ...i zmiany robione wprost na ekranie (pisanie, pogrubienie, kolor...),
    // sprawdzane co najwyżej co 150 ms.
    useEffect(() => {
      const target = flipbookContainerRef.current;
      if (!target) return;
      let timer = 0;
      const schedule = () => {
        if (!timer) timer = setTimeout(() => { timer = 0; checkDirty(); }, 150);
      };
      const mo = new MutationObserver(schedule);
      mo.observe(target, {
        subtree: true, childList: true, characterData: true,
        attributes: true, attributeFilter: ["style"]
      });
      return () => { mo.disconnect(); clearTimeout(timer); };
    }, []);

    // ---- Hide the rebuild when the book remounts ---------------------------

    const freezeRef = useRef(null);
    const unfreezeTimerRef = useRef(0);

    // Lay a static copy of the current book over it. Must be called while
    // the DOM still shows the old book (i.e. before the remount).
    // scale: zmiana powiększenia; kopia starej książki jest od razu
    // pokazywana w nowym rozmiarze.
    const freezeBook = (scale) => {
      const holder = freezeRef.current;
      const container = flipbookContainerRef.current;
      const live = container && container.querySelector(".stf__parent");
      if (!holder || !live) return;

      const copy = live.cloneNode(true);
      if (typeof scale === "number" && scale !== 1) {
        copy.style.transformOrigin = "0 0";
        copy.style.transform = `scale(${scale})`;
      }
      // cloneNode copies attributes, not values typed into inputs / chosen in lists.
      const srcInputs = live.querySelectorAll("input");
      copy.querySelectorAll("input").forEach((el, i) => { el.value = srcInputs[i].value; });
      const srcSelects = live.querySelectorAll("select");
      copy.querySelectorAll("select").forEach((el, i) => { el.value = srcSelects[i].value; });
      // The copy must never be editable or focusable.
      copy.querySelectorAll("[contenteditable]").forEach((el) => el.removeAttribute("contenteditable"));

      holder.replaceChildren(copy);

      // Safety net in case the library never reports that it's ready.
      clearTimeout(unfreezeTimerRef.current);
      unfreezeTimerRef.current = setTimeout(unfreezeBook, 1000);
    };

    // Called once the new book is initialized. Waits two frames so the new
    // book has actually been painted before the copy on top is removed.
    const unfreezeBook = () => {
      clearTimeout(unfreezeTimerRef.current);
      requestAnimationFrame(() => requestAnimationFrame(() => {
        if (freezeRef.current) freezeRef.current.replaceChildren();
      }));
    };

    const createBoxOnPage = (pageEl, clientX, clientY) => {
      const pageKey = pageEl.dataset.pageKey;
      const rect = pageEl.getBoundingClientRect();
      let left = (clientX - rect.left) / rect.width;
      let top  = (clientY - rect.top) / rect.height;

      // Narzędzie wyrównywania: kliknięcie obok kropki tworzy pole, którego
      // środek jest na kropce i zostaje tam podczas pisania.
      const snap = snapNear(pageEl, left, top, 0, 0);
      // Kliknięcie obok kropki pod obrazem: pierwsza linia nowego pola
      // będzie wyśrodkowana na tej kropce.
      const cap = snap ? null
        : snapCaption(pageEl, clientX - rect.left, clientY - rect.top, 0, 0, 0, 0);
      const anchor = snap ? snap.dot : cap ? cap.dot : null;
      if (anchor) {
        left = anchor.x;
        top = anchor.y;
      } else {
        // Not enough room between the click and the page's right / bottom
        // edge for a box with a few letters of one default-size line: no box.
        const u = pageEl.offsetWidth / REF_PAGE_W;
        const x = clientX - rect.left;
        const y = clientY - rect.top;
        if (x + NEW_BOX_MIN_W_UNITS * u + 2 > pageEl.clientWidth) return;
        if (y + NEW_BOX_MIN_H_UNITS * u + 2 > pageEl.clientHeight) return;
      }

      const id = ++boxIdRef.current;
      focusIdRef.current = id;
      setBoxes((prev) => {
        const kept = prev.filter((b) => {
          const hasText = boxHasText(boxRefs.current[b.id]);
          if (!hasText) delete boxRefs.current[b.id];
          return hasText;
        });
        return [...kept, { id, page: pageKey, left, top, html: "", width: undefined, anchor }];
      });
    };

    const trackPointer = (onMove, onUp) => {
      function up() {
        document.removeEventListener("mousemove", move, true);
        document.removeEventListener("mouseup", up, true);
        document.removeEventListener("touchmove", move, true);
        document.removeEventListener("touchend", up, true);
        window.removeEventListener("blur", up);
        onUp();
      }
      function move(ev) {
        // Przycisk puszczony poza oknem (np. po Alt+Tab): koniec przeciągania.
        if (!ev.touches && ev.buttons === 0) { up(); return; }
        onMove(ev);
      }
      document.addEventListener("mousemove", move, true);
      document.addEventListener("mouseup", up, true);
      document.addEventListener("touchmove", move, true);
      document.addEventListener("touchend", up, true);
      window.addEventListener("blur", up);   // okno straciło fokus w trakcie
    };

    // Start dragging an existing box from a given viewport point. Only
    // called while in move mode (see the pointerdown listener below).
    const startBoxDrag = (id, startX, startY) => {
      const box = boxesRef.current.find((b) => b.id === id);
      if (!box) return;

      const el = boxRefs.current[id];
      const wrapper = el && el.parentElement;
      const pageEl = wrapper && wrapper.parentElement; // textbox → wrapper → page
      if (!el || !pageEl) return;

      // left/top/width are stored as fractions of the page's full size (border included)...
      const scaleW = pageEl.offsetWidth, scaleH = pageEl.offsetHeight;
      // ...but boxes are positioned inside the page's border.
      const innerW = pageEl.clientWidth, innerH = pageEl.clientHeight;

      // Measure the box once; it must not change size while being moved.
      const rect = el.getBoundingClientRect();
      const boxW = rect.width, boxH = rect.height;
	        // Gdzie w polu jest środek jego pierwszej linii (do kropek pod obrazami).
      const line = firstLineCenter(el);

      // If the text is currently wrapping, lock the box at its current width
      // so a new position can't rewrap it wider or narrower.
      let lockedWidth = box.width;
      if (lockedWidth === undefined) {
        const prevW = el.style.width, prevMax = el.style.maxWidth;
        el.style.width = "max-content";
        el.style.maxWidth = "none";
        const naturalW = el.getBoundingClientRect().width;
        el.style.width = prevW;
        el.style.maxWidth = prevMax;
        if (naturalW > boxW + 0.5) lockedWidth = boxW / scaleW;
      }

      // Start z ekranu: pole wyśrodkowane na kropce mogło się przesunąć przy pisaniu.
      const originLeft = wrapper.offsetLeft / scaleW, originTop = wrapper.offsetTop / scaleH;
      const maxLeft = Math.max((innerW - boxW) / scaleW, 0);
      const maxTop  = Math.max((innerH - boxH) / scaleH, 0);

      let nextLeft = originLeft, nextTop = originTop, moved = false;
      let nextAnchor = box.anchor || null;

      // The wrapper is the box's layer, so that is what has to go on top.
      const originalZIndex = wrapper.style.zIndex;
      wrapper.style.zIndex = "900000";

      trackPointer((ev) => {
        const p = ev.touches ? ev.touches[0] : ev;
        nextLeft = Math.min(Math.max(originLeft + (p.clientX - startX) / scaleW, 0), maxLeft);
        nextTop  = Math.min(Math.max(originTop  + (p.clientY - startY) / scaleH, 0), maxTop);
		        const snap = snapNear(pageEl, nextLeft, nextTop, boxW / scaleW, boxH / scaleH);
        // Kropka pod obrazem: środek pierwszej linii blisko niej = na niej.
        const cap = snap ? null : snapCaption(pageEl,
          nextLeft * scaleW + line.x, nextTop * scaleH + line.y,
          line.x, line.y, boxW, boxH);
        const hit = snap || cap;
        nextAnchor = hit ? hit.dot : null;
        if (hit) { nextLeft = hit.left; nextTop = hit.top; }

        if (!moved) {
          moved = true;
          if (lockedWidth !== box.width) {
            el.style.width = el.style.maxWidth = (lockedWidth * scaleW) + "px";
          }
        }
        wrapper.style.left = (nextLeft * scaleW) + "px";
        wrapper.style.top  = (nextTop  * scaleH) + "px";
      }, () => {
        wrapper.style.zIndex = originalZIndex;
        if (!moved) return;
        setBoxes((prev) => prev.map((b) =>
            b.id === id ? { ...b, left: nextLeft, top: nextTop, width: lockedWidth, anchor: nextAnchor, z: null } : b
        ));
      });
    };

    // Start dragging a picture (move mode). Same rules as text boxes: the
    // picture keeps its size and always stays inside the page.
    const startImageDrag = (id, el, startX, startY) => {
      const img = imagesRef.current.find((im) => im.id === id);
      const pageEl = el && el.parentElement; // img → page
      if (!img || !pageEl) return;

      const scaleW = pageEl.offsetWidth, scaleH = pageEl.offsetHeight;
      const innerW = pageEl.clientWidth, innerH = pageEl.clientHeight;
      const imgW = img.w * scaleW, imgH = img.h * scaleH;

      const originLeft = img.left, originTop = img.top;
	  // Podpis musi dać się wyśrodkować pod obrazem: środek obrazu tylko
      // tam, gdzie podpis zmieści się na stronie w poziomie.
      const xr = captionXRange(pageEl, id);
      let minLeft = Math.max((xr.min - imgW / 2) / scaleW, 0);
      let maxLeft = Math.min(Math.max((innerW - imgW) / scaleW, 0), (xr.max - imgW / 2) / scaleW);
      if (minLeft > maxLeft) minLeft = maxLeft = originLeft;   // brak miejsca: bez ruchu w poziomie
      // Pod obrazem musi się zmieścić przyklejony do niego podpis.
      const below = captionRoomBelow(pageEl, id);
      const maxTop  = Math.max((innerH - imgH - below) / scaleH, 0);
	  
      let nextLeft = originLeft, nextTop = originTop, moved = false;

      raiseImageDom(pageEl, id, true);

      trackPointer((ev) => {
        const p = ev.touches ? ev.touches[0] : ev;
        nextLeft = Math.min(Math.max(originLeft + (p.clientX - startX) / scaleW, minLeft), maxLeft);
        nextTop  = Math.min(Math.max(originTop  + (p.clientY - startY) / scaleH, 0), maxTop);
		const snap = snapNear(pageEl, nextLeft, nextTop, img.w, img.h);
        if (snap && snap.top <= maxTop && snap.left >= minLeft && snap.left <= maxLeft) {
          nextLeft = snap.left; nextTop = snap.top;
        }
        moved = true;
        layoutImageDom(pageEl, id, nextLeft * scaleW, nextTop * scaleH, imgW, imgH);
      }, () => {
        raiseImageDom(pageEl, id, false);
        if (!moved) return;
        setImages((prev) => prev.map((im) =>
          im.id === id ? { ...im, left: nextLeft, top: nextTop, z: null } : im
        ));
		commitImageFollowers(id);
      });
    };

    // Resize a picture by one of its corners (move mode). The opposite
    // corner stays put, proportions are kept, and it never leaves the page.
    const startImageResize = (id, pageEl, corner, startX, startY) => {
      const img = imagesRef.current.find((im) => im.id === id);
      if (!img || !pageEl) return;

      const scaleW = pageEl.offsetWidth, scaleH = pageEl.offsetHeight;
      const innerW = pageEl.clientWidth, innerH = pageEl.clientHeight;

      // Everything below is in page pixels.
      const x0 = img.left * scaleW, y0 = img.top * scaleH;
      const w0 = img.w * scaleW,    h0 = img.h * scaleH;
      const ratio = w0 / h0;

      // sx / sy: which way the dragged corner grows the picture.
      const sx = corner === "ne" || corner === "se" ? 1 : -1;
      const sy = corner === "sw" || corner === "se" ? 1 : -1;
      // The fixed (opposite) corner.
      const ax = sx > 0 ? x0 : x0 + w0;
      const ay = sy > 0 ? y0 : y0 + h0;

      // Largest width that keeps the picture inside the page.
      const roomX = sx > 0 ? innerW - ax : ax;
      // Ciągnięcie w dół: pod obrazem musi zostać miejsce na jego podpis.
      // Ciągnięcie w górę: dolna krawędź stoi w miejscu, więc podpis też.
      const below = sy > 0 ? captionRoomBelow(pageEl, id) : 0;
      const roomY = sy > 0 ? Math.max(innerH - ay - below, 0) : ay;
            // Podpis ma zostać wyśrodkowany: środek obrazu (przesuwa się przy
      // zmianie szerokości) tylko w zakresie, w którym podpis się mieści.
      const xr = captionXRange(pageEl, id);
      const capW   = sx > 0 ? 2 * (xr.max - ax) : 2 * (ax - xr.min);
      const floorW = sx > 0 ? 2 * (xr.min - ax) : 2 * (ax - xr.max);
      const maxW = Math.max(Math.min(roomX, roomY * ratio, capW), 1);
      // Shorter side at least MIN_IMAGE_SIDE (unless it already was smaller).
      const minW = Math.min(
        Math.max(Math.min(ratio >= 1 ? MIN_IMAGE_SIDE * ratio : MIN_IMAGE_SIDE, w0), floorW),
        maxW
      );

      // Keep the resize cursor even when the mouse leaves the handle.
      const cursorClass = (sx * sy > 0) ? "resizing-nwse" : "resizing-nesw";
      document.documentElement.classList.add(cursorClass);

      let curL = x0, curT = y0, curW = w0, curH = h0, moved = false;
	  
	  raiseImageDom(pageEl, id, true);

      trackPointer((ev) => {
        const p = ev.touches ? ev.touches[0] : ev;
        const dx = p.clientX - startX, dy = p.clientY - startY;

        // Follow whichever direction the mouse pulled further.
        let w = Math.max(w0 + sx * dx, (h0 + sy * dy) * ratio);
        w = Math.min(Math.max(w, minW), maxW);
        const hgt = w / ratio;

        curW = w;
        curH = hgt;
        curL = sx > 0 ? ax : ax - w;
        curT = sy > 0 ? ay : ay - hgt;
        moved = true;
        layoutImageDom(pageEl, id, curL, curT, curW, curH);
     }, () => {
        document.documentElement.classList.remove(cursorClass);
        raiseImageDom(pageEl, id, false);
        if (!moved) return;
        setImages((prev) => prev.map((im) =>
          im.id === id
            ? { ...im, left: curL / scaleW, top: curT / scaleH, w: curW / scaleW, h: curH / scaleH, z: null }
            : im
        ));
		commitImageFollowers(id);
      });
    };
    const startBoxResize = (id, startX, edge) => {
      const box = boxesRef.current.find((b) => b.id === id);
      if (!box) return;

      const el = boxRefs.current[id];
      const wrapper = el && el.parentElement;
      const pageContainer = wrapper && wrapper.parentElement;
      if (!el || !wrapper || !pageContainer) return;

      const pageW = pageContainer.offsetWidth;
      const innerW = pageContainer.clientWidth;

      // Natural width of the text (padding + border included), measured with
      // all width constraints removed. This is the widest the box may get.
      const prevWidth = el.style.width;
      const prevMaxWidth = el.style.maxWidth;
      el.style.width = "max-content";
      el.style.maxWidth = "none";
      const naturalWidth = Math.ceil(el.getBoundingClientRect().width) / pageW;
      el.style.width = prevWidth;
      el.style.maxWidth = prevMaxWidth;

      const originLeft = wrapper.offsetLeft / pageW;
      const originWidth = el.offsetWidth / pageW;
      const originRight = originLeft + originWidth;
      // Allow shrinking, but never force a minimum wider than the text itself.
      const minWidth = Math.min(0.05, naturalWidth);
	        // Podpis przyklejony do obrazu: szerokość zmienia się symetrycznie
      // wokół kropki, więc podpis zostaje przyklejony i wyśrodkowany.
      const isCaption = !!el.dataset.anchorImage;

      // True if the box, at this width, still ends above the page's bottom
      // edge. Narrower = more wrapped lines = taller box.
      const fitsAtWidth = (w) => {
        const pw = el.style.width, pm = el.style.maxWidth;
        el.style.width = el.style.maxWidth = (w * pageW) + "px";
        const ok = fitsInPage(el);
        el.style.width = pw;
        el.style.maxWidth = pm;
        return ok;
      };
      let lastGoodWidth = originWidth;
      let nextLeft = originLeft, nextWidth = originWidth, moved = false;

      const originalZIndex = el.style.zIndex;
      el.style.zIndex = "10000";

      trackPointer((ev) => {
	    if (!moved && !isCaption) {
          delete el.dataset.anchorX;
          delete el.dataset.anchorY;
          delete el.dataset.anchorImage;
        }
        const p = ev.touches ? ev.touches[0] : ev;
        const dx = (p.clientX - startX) / pageW;

        let w;
        if (isCaption) {
          // Obie krawędzie ruszają się razem; podpis mieści się na stronie
          // po obu stronach kropki (środka obrazu).
          const cx = parseFloat(el.dataset.anchorX) * pageW;
          const maxW = 2 * Math.min(cx, innerW - cx) / pageW;
          w = originWidth + (edge === "left" ? -2 * dx : 2 * dx);
          w = Math.max(minWidth, Math.min(w, naturalWidth, maxW));
        } else {
          w = edge === "left" ? originWidth - dx : originWidth + dx;
          const maxW = edge === "left" ? originRight : innerW / pageW - originLeft;
          w = Math.max(minWidth, Math.min(w, naturalWidth, maxW));
        }

        // Narrowing would push the bottom below the page: find the narrowest
        // width that still fits and stop there.
        if (w < lastGoodWidth && !fitsAtWidth(w)) {
          let lo = w, hi = lastGoodWidth;
          for (let i = 0; i < 12; i++) {
            const mid = (lo + hi) / 2;
            if (fitsAtWidth(mid)) hi = mid; else lo = mid;
          }
          w = hi;
        }
        lastGoodWidth = w;

        nextWidth = w;
        moved = true;
        el.style.width = el.style.maxWidth = (nextWidth * pageW) + "px";
        if (isCaption) {
          keepAnchored(el);   // wyśrodkuj pod obrazem przy nowej szerokości
        } else {
          nextLeft = edge === "left" ? originRight - w : originLeft;
          wrapper.style.left = (nextLeft * pageW) + "px";
        }
		placeToolbar(wrapper);
    }, () => {
        el.style.zIndex = originalZIndex;
        if (!moved) return;
        if (isCaption) {
          // Podpis zostaje przyklejony: zapisz nową szerokość i położenie z ekranu.
          const left = wrapper.offsetLeft / pageW;
          const top = wrapper.offsetTop / pageContainer.offsetHeight;
          setBoxes((prev) => prev.map((b) =>
            b.id === id ? { ...b, left, top, width: nextWidth } : b
          ));
          return;
        }
        setBoxes((prev) => prev.map((b) =>
            b.id === id ? { ...b, left: nextLeft, width: nextWidth, anchor: null } : b
        ));
      });
    };

    // Ctrl+C in move mode: remember the selected picture, or the selected
    // box's content and size.
    const copySelectedBox = () => {
      // A picture is selected: copy the picture.
      const imageId = selectedImageIdRef.current;
      if (imageId !== null) {
        const img = imagesRef.current.find((im) => im.id === imageId);
        if (!img) return;
        clipboardRef.current = {
          kind: "image",
          sourceId: imageId,
          src: img.src,
          w: img.w,
          h: img.h
        };
        return;
      }

      const id = selectedIdRef.current;
      const box = boxesRef.current.find((b) => b.id === id);
      const el = boxRefs.current[id];
      if (!box || !el || !boxHasText(el)) return;
      const pageEl = el.parentElement && el.parentElement.parentElement;
      if (!pageEl) return;

      // Same rule as dragging: if the text is currently wrapping, lock the
      // width so the copy looks identical wherever it lands.
      let widthPx = box.width !== undefined ? box.width * pageEl.offsetWidth : undefined;
      if (widthPx === undefined) {
        const currentW = el.offsetWidth;
        const prevW = el.style.width, prevMax = el.style.maxWidth;
        el.style.width = "max-content";
        el.style.maxWidth = "none";
        const naturalW = el.offsetWidth;
        el.style.width = prevW;
        el.style.maxWidth = prevMax;
        if (naturalW > currentW) widthPx = currentW;
      }

      clipboardRef.current = {
        kind: "box",
        sourceId: id,
        html: el.innerHTML,            // live DOM, not the possibly stale box.html
        widthPx,
        boxW: widthPx !== undefined ? widthPx : el.offsetWidth,
        boxH: el.offsetHeight,
		line: firstLineCenter(el)
      };
    };

    // The inner page under the mouse cursor, or null.
    const pageUnderPointer = () => {
      const p = lastPointerRef.current;
      if (!p.known) return null;
      const hit = document.elementFromPoint(p.x, p.y);
      const pg = hit && hit.closest(".page");
      if (pg && !pg.classList.contains("page-cover") && wrapRef.current && wrapRef.current.contains(pg)) {
        return pg;
      }
      return null;
    };

    // Ctrl+V in move mode with a copied picture: drop a copy under the
    // cursor (or next to the original), kept inside the page.
    const pasteImage = (clip) => {
      let pageEl = pageUnderPointer(), x = 0, y = 0;
      if (pageEl) {
        x = lastPointerRef.current.x;
        y = lastPointerRef.current.y;
      } else {
        const container = flipbookContainerRef.current;
        const src = container && container.querySelector(`.page-image[data-image-id="${clip.sourceId}"]`);
        const pg = src && src.parentElement;
        if (!pg) return;
        const r = src.getBoundingClientRect();
        pageEl = pg; x = r.left + 16; y = r.top + 16;
      }

      const rect = pageEl.getBoundingClientRect();
      const scaleW = pageEl.offsetWidth, scaleH = pageEl.offsetHeight;
      const maxLeft = Math.max(pageEl.clientWidth / scaleW - clip.w, 0);
      const maxTop  = Math.max(pageEl.clientHeight / scaleH - clip.h, 0);
      let left = Math.min(Math.max((x - rect.left) / rect.width, 0), maxLeft);
      let top  = Math.min(Math.max((y - rect.top) / rect.height, 0), maxTop);
      const snap = snapNear(pageEl, left, top, clip.w, clip.h);
      if (snap) { left = snap.left; top = snap.top; }

      const id = ++imageIdRef.current;
      setImages((prev) => [...prev, {
        id,
        page: pageEl.dataset.pageKey,
        src: clip.src,
        left, top,
        w: clip.w,
        h: clip.h
      }]);
      selectImage(id); // repeated Ctrl+V continues from the fresh copy
    };
    // Ctrl+V in move mode: drop a copy under the cursor (or next to the
    // original if the cursor isn't over a writable page), kept inside the page.
    const pasteBox = () => {
      const clip = clipboardRef.current;
      if (!clip) return;
      if (clip.kind === "image") {
        pasteImage(clip);
        return;
      }

      let pageEl = pageUnderPointer(), x = 0, y = 0;
      if (pageEl) {
        x = lastPointerRef.current.x;
        y = lastPointerRef.current.y;
      } else {
        const src = boxRefs.current[clip.sourceId];
        const pg = src && src.parentElement && src.parentElement.parentElement;
        if (!pg) return;
        const r = src.getBoundingClientRect();
        pageEl = pg; x = r.left + 16; y = r.top + 16;
      }

      const rect = pageEl.getBoundingClientRect();
      const scaleW = pageEl.offsetWidth, scaleH = pageEl.offsetHeight;
      const innerW = pageEl.clientWidth, innerH = pageEl.clientHeight;
      const maxLeft = Math.max((innerW - clip.boxW) / scaleW, 0);
      const maxTop  = Math.max((innerH - clip.boxH) / scaleH, 0);
      let left = Math.min(Math.max((x - rect.left) / rect.width, 0), maxLeft);
      let top  = Math.min(Math.max((y - rect.top) / rect.height, 0), maxTop);
      const snap = snapNear(pageEl, left, top, clip.boxW / scaleW, clip.boxH / scaleH);
      const cap = snap ? null : snapCaption(pageEl,
        left * scaleW + clip.line.x, top * scaleH + clip.line.y,
        clip.line.x, clip.line.y, clip.boxW, clip.boxH);
      const hit = snap || cap;
      if (hit) { left = hit.left; top = hit.top; }

      const id = ++boxIdRef.current;
      setBoxes((prev) => [...prev, {
        id,
        page: pageEl.dataset.pageKey,
        left, top,
        html: clip.html,
        width: clip.widthPx !== undefined ? clip.widthPx / scaleW : undefined,
        anchor: hit ? hit.dot : null
      }]);
      selectBox(id); // repeated Ctrl+V continues from the fresh copy
    };
    // ---- Wymiary i obrót wpisane ręcznie (tryb przesuwania) ---------------

    // Obraz o wpisanej szerokości / wysokości (jednostki strony). Proporcje
    // zostają, środek obrazu zostaje w miejscu, o ile się da; obraz i jego
    // podpisy zawsze mieszczą się na stronie.
    const resizeImageTo = (pageEl, id, dim, units) => {
      const img = imagesRef.current.find((im) => im.id === id);
      if (!img || !(units > 0)) return false;
      const pageW = pageEl.offsetWidth, pageH = pageEl.offsetHeight;
      const innerW = pageEl.clientWidth, innerH = pageEl.clientHeight;
      const w0 = img.w * pageW, h0 = img.h * pageH, ratio = w0 / h0;

      const px = units / REF_PAGE_W * pageW;   // wpisana wartość jest w jednostkach strony
      let W = dim === "w" ? px : px * ratio;

      const below = captionRoomBelow(pageEl, id);
      const xr = captionXRange(pageEl, id);
      const maxW = Math.max(Math.min(innerW, (innerH - below) * ratio, 2 * xr.max, 2 * (innerW - xr.min)), 1);
      const minW = Math.min(ratio >= 1 ? MIN_IMAGE_SIDE * ratio : MIN_IMAGE_SIDE, w0, maxW);
      W = Math.min(Math.max(W, minW), maxW);
      const H = W / ratio;

      const cx = (img.left + img.w / 2) * pageW, cy = (img.top + img.h / 2) * pageH;
      const loL = Math.max(0, xr.min - W / 2), hiL = Math.min(innerW - W, xr.max - W / 2);
      const Lpx = loL <= hiL ? Math.min(Math.max(cx - W / 2, loL), hiL) : clampTo(cx - W / 2, innerW - W);
      const Tpx = clampTo(cy - H / 2, innerH - below - H);

      layoutImageDom(pageEl, id, Lpx, Tpx, W, H);   // podpisy przesuwają się od razu
      const next = imagesRef.current.map((im) => im.id === id
        ? { ...im, left: Lpx / pageW, top: Tpx / pageH, w: W / pageW, h: H / pageH } : im);
      imagesRef.current = next;
      setImages(next);
      commitImageFollowers(id);
      return true;
    };
    // Pole z wartością straciło fokus (Enter, kliknięcie obok...): zastosuj
    // wpisaną wartość. Niepoprawna wartość: wraca poprzednia.
    const commitDimInput = (input) => {
      const start = input.dataset.startValue;
      delete input.dataset.startValue;
      if (start === undefined || input.value === start) return;

      const pageEl = input.parentElement;
      const id = Number(input.dataset.imageId);
      const dim = input.dataset.dim;
      const num = parseDimNumber(input.value);
      const ok = !!pageEl && !!pageEl.offsetWidth && isFinite(num)
        && resizeImageTo(pageEl, id, dim, num);
      if (!ok) input.value = start;
    };

    // Delete w trybie przesuwania: usuwa zaznaczony tekst lub obraz.
    // (Używa tylko refów i setterów, bo wywołuje ją listener podpięty raz.)
    const deleteSelected = () => {
      const imgId = selectedImageIdRef.current;
      const boxId = selectedIdRef.current;
      if (imgId !== null) {
        setImages((prev) => prev.filter((im) => im.id !== imgId));
        // Podpisy przyklejone do usuniętego obrazu zostają jako zwykłe pola.
        setBoxes((prev) => prev.map((b) => {
          if (!b.anchor || b.anchor.imageId !== imgId) return b;
          return { ...b, ...livePos(b, boxRefs.current[b.id]), anchor: null };
        }));
      } else if (boxId !== null) {
        setBoxes((prev) => prev.filter((b) => b.id !== boxId));
        delete boxRefs.current[boxId];
      } else {
        return;
      }
      selectBox(null);
    };
    // Keyboard shortcuts and cursor tracking. These are attached once; the
    // functions they call only use refs and state setters, so the first
    // render's closures stay valid.
    useEffect(() => {
      const onKeyDown = (e) => {
        // Ctrl+A only selects text inside a text box or an input field.
        // Anywhere else it would highlight the whole interface.
        if (e.ctrlKey && !e.altKey && !e.metaKey && e.code === "KeyA") {
          const a = document.activeElement;
          const editable = a && (a.isContentEditable || a.tagName === "INPUT" || a.tagName === "TEXTAREA");
          if (!editable) e.preventDefault();
          return;
        }

            || openDialogOpenRef.current || closeDialogOpenRef.current
            || dotDialogOpenRef.current || layoutsDialogOpenRef.current
            || newDialogOpenRef.current || removeDotsDialogOpenRef.current) return;
        if (toolRef.current !== TOOL_MOVE) return;
        // Pisanie w polu (np. wymiar obrazu): skróty trybu przesuwania nie działają.
        const ae = document.activeElement;
        if (ae && (ae.tagName === "INPUT" || ae.tagName === "SELECT" || ae.tagName === "TEXTAREA")) return;
        // Delete: usuwa zaznaczony tekst, obraz lub wzór.
        if (e.key === "Delete" && !e.ctrlKey && !e.altKey && !e.metaKey && !e.shiftKey) {
          e.preventDefault();
          deleteSelected();
          return;
        }
        if (!e.ctrlKey || e.metaKey || e.altKey || e.shiftKey) return;
        if (e.code === "KeyC") {
          e.preventDefault();
          copySelectedBox();
        } else if (e.code === "KeyV") {
          e.preventDefault();
          if (!e.repeat) pasteBox(); // holding the keys doesn't spam copies
        }
      };
      const onMove = (e) => {
        lastPointerRef.current = { x: e.clientX, y: e.clientY, known: true };
      };
      const onOut = (e) => {
        if (!e.relatedTarget) lastPointerRef.current.known = false; // left the window
      };
      // Font size (in page units) of the text at a given position inside a
      // textbox. If the position points between child nodes (e.g. right next
      // to a sized <span>), look at the node there instead of the parent box.
      const sizeAt = (container, offset) => {
        let node = container;
        if (node.nodeType === Node.ELEMENT_NODE) {
          node = node.childNodes[offset] || node.childNodes[offset - 1] || node;
        }
        const el = node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement;
        return Math.round(parseFloat(getComputedStyle(el).fontSize) / unitOf(el));
      };

      const onSelectionChange = () => {
        const sel = window.getSelection();
        if (!sel.rangeCount) return;
        const node = sel.anchorNode;
        const el = node && (node.nodeType === Node.ELEMENT_NODE ? node : node.parentElement);
        const boxEl = el && el.closest(".textbox");
        if (!boxEl) return; // e.g. focus moved into the font-size input: keep what we saved

        const range = sel.getRangeAt(0);
        const input = boxEl.previousElementSibling;

        // Caret on an empty line (right after a line break, with only another
        // line break or nothing after it): give it a text node to sit in, at
        // that exact spot, so typing there keeps that line's formatting.
        if (range.collapsed && boxEl.isContentEditable
            && range.startContainer.nodeType === Node.ELEMENT_NODE) {
          const parent = range.startContainer;
          const before = parent.childNodes[range.startOffset - 1];
          const after = parent.childNodes[range.startOffset];
          if (before && before.nodeName === "BR" && (!after || after.nodeName === "BR")) {
            const t = document.createTextNode(ZWSP);
            parent.insertBefore(t, after || null);
            const r = document.createRange();
            r.setStart(t, 1);
            r.collapse(true);
            sel.removeAllRanges();
            sel.addRange(r); // fires selectionchange again, which does the rest
            return;

        }

        // are still waiting for text: tidy them into one chain and put the
        // caret at its single spot, so the settings never jump around.
        if (boxEl.isContentEditable && pendingFixCount < 5) {
          const cluster = range.collapsed
            ? pendingClusterAt(boxEl, range.startContainer, range.startOffset)
            : pendingClusterIn(boxEl, range);
          if (cluster) {
            const slot = canonicalPendingSlot(cluster);
            const already = sel.isCollapsed && sel.rangeCount
              && sel.getRangeAt(0).startContainer === slot
              && sel.getRangeAt(0).startOffset === slot.length;
            if (!already) {
              pendingFixCount++;
              const r = document.createRange();
              r.setStart(slot, slot.length);

        // the input can be applied at the caret.
        savedRangeRef.current = { boxId: Number(boxEl.dataset.boxId), range: range.cloneRange() };

        if (input) {
          const first = !range.collapsed && textNodesInRange(range)[0];

        }

      };

      window.addEventListener("mousemove", onMove, true);
      document.addEventListener("mouseout", onOut, true);
      document.addEventListener("selectionchange", onSelectionChange);
      return () => {

    // are attached to document in capture phase, they fire before this handler
    // and are not affected by stopPropagation.
    useEffect(() => {
      const wrap = wrapRef.current;

        // inner page places it. Nothing else in the book reacts (no flipping,
        // no covers).
        if (pendingImageRef.current) {
          if (e.target.closest(".toggle-btn")) return; // the tool buttons still work
          e.preventDefault();
          e.stopPropagation();

          if (pageEl && !pageEl.classList.contains("page-cover")) {

        if (e.target.closest(".fontsize-spin")) return;
        if (e.target.closest(".format-btn")) return;
        if (e.target.closest(".font-family-control")) return;

        const boxEl = e.target.closest(".textbox")

        }

        if (e.target.closest(".fontsize-control")) return;
        if (e.target.closest(".font-family-control")) return;

    useEffect(() => {

          // focus back afterwards) and capture all live content first.

    const pageInputText = pageInput !== null ? pageInput : spreadNow;

    const measureView = () => {

    // środku jej miejsca, zostaje na środku: książka rośnie i maleje wokół niego.

                    cx: view.cx, cy: view.cy, cw: lay.cw, ch: lay.ch };
      const prev = lastLayoutRef.current;
      if (prev && Object.keys(cur).every((k) => prev[k] === cur[k])) return;
      lastLayoutRef.current = cur;
      const part = (v) => Math.min(Math.max(v, 0), 1);
      let fx = 0.5, fy = 0.5;

        fy = part((scrollPosRef.current.t + prev.cy - prev.y) / prev.bh);

    });

      const a = zoomedPageSize(base, from), b = zoomedPageSize(base, pct);
      if (a.w !== b.w || a.h !== b.h) {

        // zapisywana w stanie, zanim stara książka zniknie...

        syncBoxesFromDOM();
        // ...a zanim nowa będzie gotowa, widać już powiększoną starą.
        freezeBook(b.w / a.w);
      }
      zoomRef.current = pct;
      setZoom(pct);
      // Program zapisuje nowe powiększenie w pliku ustawień: zostaje takie
      // samo po zamknięciu programu i po ponownym uruchomieniu komputera.

    // uchwyt w to miejsce, przeciąganie go przesuwa. Książka zmienia się na
    // bieżąco, a po puszczeniu przycisku zostaje zbudowana w nowym rozmiarze.
