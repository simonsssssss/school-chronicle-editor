	  captionOn
    });

    // Tooltip note for the buttons that don't work on a cover.
    const coverNote = coverLock ? " (niedostępne na okładce)" : "";
    // Dodawanie stron działa na okładce tylko wtedy, gdy książka jest pusta.
    const addPagesBlocked = coverLock && pageKeys.length > 0;
    return h("div", { className: "app" },
      // Warstwa z książką: całe okno, pod całym interfejsem. Gdy powiększona
      // książka nie mieści się w oknie, pojawiają się paski przewijania.
      h("div", {
        className: "book-scroller",
        ref: scrollerRef,
        onScroll: (e) => {
          scrollPosRef.current = { l: e.currentTarget.scrollLeft, t: e.currentTarget.scrollTop };
        }
      },
       h("div", {
        className: "book-scroll-content",
        style: { width: lay.cw + "px", height: lay.ch + "px" }
       },
      h("div", {
        className: wrapClass,
        ref: wrapRef,
        style: {
          left: lay.x + "px",
          top: lay.y + "px",
          width: (shown.w * 2) + "px",
          height: shown.h + "px",
          // One "page unit". Lives here, not on the pages, because the
          // page-flip library rewrites each page's style attribute.
          "--u": (size.w / REF_PAGE_W) + "px",
          "--zoom": size.w / baseSize.w
        }
      },
        h("div", {
          ref: flipbookContainerRef,
          className: "flipbook-container hidden",
          style: {
            width: (size.w * 2) + "px",
            height: size.h + "px",
            // Podgląd w trakcie przeciągania uchwytu suwaka.
            transform: previewScale !== 1 ? `scale(${previewScale})` : "",
            transformOrigin: "0 0"
          }
        },
          h(FlipBook, {
            key: `${size.w}x${size.h}#${bookVersion}`,
            width: size.w, height: size.h, size: "fixed", showCover: SHOW_COVER,
            usePortrait: false,
            useMouseEvents: true,
            startPage: pageRef.current,          // stay on the spread we were reading
            maxShadowOpacity: 0.5,
            onFlip: (e) => { setPage(e.data); clearJumpShown(); },
            onChangeOrientation: (e) => setOrientation(e.data),
            onChangeState: (e) => {
              const moving = e.data === "flipping" || e.data === "user_fold";
              const jump = jumpTargetRef.current;
              if (!moving) { jumpTargetRef.current = null; clearJumpShown(); }
              const dir = flipDirRef.current;
              // Zamyka się tylko pierwsza rozkładówka do tyłu albo ostatnia
              // do przodu (albo przewracanie do wpisanej okładki).
              setClosing(moving && (jump !== null
                ? (jump === 0 || jump > pageKeys.length)
                : (dir === "prev" && page === 1) || (dir === "next" && page + 1 >= pageKeys.length)));
            },
            onInit: () => {
              setClosing(false);    // nowa książka zawsze startuje w spoczynku
              unfreezeBook();            
              // Strony mają już swoje prawdziwe rozmiary: paski narzędzi na miejsce.
              requestAnimationFrame(() => {
                document.querySelectorAll(".textbox-wrapper").forEach(placeToolbar);
              });
            },
            ref: bookRef
          },
            h(Surface, { key: "c1", ...surfaceProps("c1", true) }),
            ...pageKeys.map((k) => h(Surface, { key: k, ...surfaceProps(k, false) })),
            h(Surface, { key: "c2", ...surfaceProps("c2", true) })
          )
        ),
        h("div", { className: "book-freeze", ref: freezeRef })
      )
       )
      ),
      // Miejsce książki przy 100% (tu książka stoi bez powiększenia). Przyciski
      // narzędzi, notki i suwak są przypięte do niego, więc zostają na swoich
      // miejscach przy każdym powiększeniu.
      h("div", {
        className: "book-slot",
        ref: slotRef,
        style: { width: (baseSize.w * 2) + "px", height: baseSize.h + "px" }
      },
          !VIEWER && h("div", { className: "toggle-row" },
            h("div", {
              className: "toggle-btn" + (tool === TOOL_TEXT ? " active" : "") + (coverLock ? " disabled" : ""),
              "data-tip": "Dodawanie tekstu" + coverNote,
              onClick: toggleTextMode
            }, "A"),
            h("div", {
              className: "toggle-btn" + (tool === TOOL_MOVE ? " active" : "") + (coverLock ? " disabled" : ""),
              "data-tip": "Przesuwanie i\u00A0kopiowanie treści" + coverNote,
              onClick: toggleMoveMode
            }, h(MoveIcon)),
            // Na okładce zablokowane (wyjątek: książka bez stron).
            h("div", {
              className: "toggle-btn" + (addPagesBlocked ? " disabled" : ""),
              "data-tip": "Dodawanie stron" + (addPagesBlocked ? coverNote : ""),
              onClick: addPages
            }, h(AddPageIcon)),
            // Delete pages: a plain button, never stays selected.
            h("div", {
              className: "toggle-btn" + (coverLock ? " disabled" : ""),
              "data-tip": "Usuwanie wyświetlanych stron" + coverNote,
              onClick: openDeleteDialog
            }, h(DeletePageIcon)),
            // Add an image: never stays selected, blocked on the covers.
            h("div", {
              className: "toggle-btn" + (coverLock ? " disabled" : ""),
              "data-tip": "Dodawanie obrazów" + coverNote,
              onClick: openImageDialog
            }, h(AddImageIcon)),
            // Wyrównywanie do punktów: działa razem z innymi narzędziami,
            // ale nie razem z wyrównywaniem do obrazów.
            h("div", {
              className: "toggle-btn" + (alignOn ? " active" : "")
                + (captionOn || coverLock ? " disabled" : ""),
              "data-tip": "Wyrównywanie do punktów"
                + (captionOn ? " (niedostępne, gdy włączone jest wyrównywanie tekstu do obrazów)" : coverNote),
              onMouseDown: (e) => e.preventDefault(),
              onClick: toggleAlign
            }, h(MagnetIcon)),
            // Wyrównywanie tekstu do obrazów: kropki pod obrazami.
            h("div", {
              className: "toggle-btn" + (captionOn ? " active" : "")
                + (alignOn || coverLock ? " disabled" : ""),
              "data-tip": "Wyrównywanie tekstu do obrazów"
                + (alignOn ? " (niedostępne, gdy włączone jest wyrównywanie do punktów)" : coverNote),
              onMouseDown: (e) => e.preventDefault(),
              onClick: toggleCaption
            }, h(CaptionAlignIcon))
          ),
          !hideHints && !VIEWER && h("div", { className: "hint-stack" },
            alignOn && h("div", { className: "move-hint" },
              "Aby wyrównać treść na stronie, przeciągnij ją tak, żeby jej środek znalazł się blisko kropki."
            ),
            captionOn && h("div", { className: "move-hint" },
              "Przeciągnij tekst tak, aby jego górna część znalazła " +
              "się na kropce pod obrazem. Tekst przyklei się i\u00A0zostanie wyśrodkowany."
            ),
            tool === TOOL_MOVE && h("div", { className: "move-hint" },
              "Aby skopiować tekst lub obraz, kliknij go, a\u00A0następnie użyj",
              h("br"),
              h("kbd", null, "Ctrl + C"),
              " i\u00A0",
              h("kbd", null, "Ctrl + V"),
              ".",
              h("br"),
              h("br"),
              "Aby usunąć tekst lub obraz, kliknij go, a\u00A0następnie naciśnij ",
              h("kbd", null, "Delete"),
              "."
            ),
            pendingImage && h("div", { className: "move-hint" },
              pendingImage.loading
                ? "Wczytywanie obrazu… Możesz już kliknąć miejsce na stronie."
                : "Kliknij miejsce na stronie, w\u00A0którym ma się pojawić obraz."
            )
          ),
          // Suwak powiększenia przy lewym dolnym rogu książki (pionowy).
          !VIEWER && zoomControl()
      ),
      // Wiersz pod książką: przyciski kropek przy lewej krawędzi książki,
      // przewracanie stron na środku, przyciski plików przy prawej.
      h("div", {
        className: "controls" + (VIEWER ? " viewer-controls" : ""),
        style: { width: (baseSize.w * 2) + "px" }
      },
        // Przyciski niestandardowego układu kropek (wyrównywanie do punktów).
        !VIEWER && h("div", {
          className: "dots-actions" + (alignOn && !coverLock ? " visible" : ""),
          onMouseDown: (e) => e.preventDefault()   // nie zabiera fokusu z tekstu
        },
          h("div", {
            className: "dots-btn",
            "data-tip": "Dodaj kropkę",
            onClick: openDotDialog
          }, h(AddDotIcon)),
          h("div", {
            className: "dots-btn",
            "data-tip": "Usuń kropkę",
            onClick: openRemoveDotsDialog
          }, h(RemoveDotIcon)),
          h("div", {
            className: "dots-btn",
            "data-tip": "Zapisz niestandardowy układ punktów",
            onClick: saveCustomLayout
          }, h(SaveLayoutIcon)),
          h("div", {
            className: "dots-btn",
            "data-tip": "Wybierz niestandardowy układ punktów",
            onClick: chooseCustomLayout
          }, h(ChooseLayoutIcon))
        ),
        h("div", { className: "nav-group" },
          h("button", { onClick: () => {
            flipDirRef.current = "prev";
            bookRef.current.pageFlip().flipPrev();
          } }, "◀ Poprzednia"),
          h("span", { className: "counter" },
            h("input", {
              type: "text",
              className: "page-input",
              inputMode: "numeric",
              maxLength: 15,
              spellCheck: false,
              autoComplete: "off",
              "data-tip": "Wpisz numer strony albo rozkładówki (np. 2 - 3) i naciśnij Enter",
              value: pageInputText,
              style: { width: Math.max(2, pageInputText.length) + "ch" },
              onFocus: (e) => {
                const el = e.target;
                setPageInput(spreadNow);
                setTimeout(() => { if (document.activeElement === el) el.select(); }, 0);
              },
              // Tylko cyfry, spacje i myślnik.
              onChange: (e) => setPageInput(e.target.value.replace(/[^0-9\s\-–]/g, "")),
              onKeyDown: (e) => {
                e.stopPropagation();
                if (e.key === "Enter") {
                  e.preventDefault();
                  e.target.blur();                  // przewraca (onBlur)
                } else if (e.key === "Escape") {
                  e.preventDefault();
                  pageInputCancelRef.current = true;
                  e.target.blur();
                }
              },
              onBlur: commitPageInput
            }),
            " / " + total
          ),
          h("button", { onClick: () => {
            flipDirRef.current = "next";
            bookRef.current.pageFlip().flipNext();
          } }, "Następna ▶")
        ),
        // Wersja tylko do przeglądania nie ma przycisków plików: w ich miejscu
        // jest poziomy suwak powiększenia.
        VIEWER && zoomControl(),
        !VIEWER && h("div", { className: "file-row" },
          h("div", {
            className: "file-btn",
            "data-tip": "Nowa kronika",
            onMouseDown: (e) => e.preventDefault(),   // nie zabiera fokusu z tekstu
            onClick: requestNew
          }, h(NewDocIcon)),
          h("div", {
            className: "file-btn",
            "data-tip": "Otwórz",
            onMouseDown: (e) => e.preventDefault(),
            onClick: requestOpen
          }, h(OpenFileIcon)),
          h("div", {
            className: "file-btn" + (hasFile && !dirty ? " disabled" : ""),
            "data-tip": "Zapisz",
            onMouseDown: (e) => e.preventDefault(),
            onClick: requestSave
          }, h(SaveLayoutIcon)),
          h("div", {
            className: "file-btn",
            "data-tip": "Zapisz jako",
            onMouseDown: (e) => e.preventDefault(),
            onClick: requestSaveAs
          }, h(SaveAsIcon)),
          h("div", {
            className: "file-btn",
            "data-tip": "Utwórz wersję tylko do przeglądania",
            onMouseDown: (e) => e.preventDefault(),
            onClick: requestExport
          }, h(ExportViewerIcon))
        )
      ),
      h("div", {
        className: "dialog-overlay" + (dialogOpen ? " visible" : ""),
        // Pressing anywhere outside the dialog box closes it (same as "Anuluj").
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeDeleteDialog();
          }
        }
      },
        h("div", { className: "dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Usunąć strony?"),
          h("div", { className: "dialog-text" },
            `Dwie aktualnie wyświetlane strony (${dialogPages}) zostaną usunięte razem z\u00A0ich zawartością.`
          ),
          h("div", { className: "dialog-actions" },
            h("button", { onClick: closeDeleteDialog }, "Anuluj"),
            h("button", { className: "danger", onClick: deleteCurrentSpread }, "Usuń")
          )
        )
      ),
      // "Dodaj obraz" window: closes only via "Anuluj" or a click outside it.
      h("div", {
        className: "dialog-overlay" + (imageDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeImageDialog();
          }
        }
      },
        h("div", { className: "dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Dodaj obraz"),
          h("div", { className: "dialog-text" },
            "Wybierz jeden plik graficzny (JPG, PNG, GIF, BMP, WEBP, SVG, ICO, AVIF). " +
            "Potem kliknij miejsce na stronie, w\u00A0którym ma się pojawić."
          ),
          h("input", {
            type: "file",
            accept: IMAGE_ACCEPT,
            ref: imageInputRef,
            style: { display: "none" },
            onChange: onImageFileChosen
          }),
          h("div", { className: "dialog-actions" },
            h("button", { onClick: closeImageDialog }, "Anuluj"),
            h("button", { className: "primary", onClick: chooseImageFile }, "Wybierz plik…")
          )
        )
      ),
      // Ostrzeżenie przed otwarciem pliku (tylko gdy jest coś do stracenia).
      // Zamyka się tylko przez "Anuluj" albo kliknięcie poza nim.
      h("div", {
        className: "dialog-overlay" + (openDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeOpenDialog();
          }
        }
      },
        h("div", { className: "dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Otworzyć plik?"),
          h("div", { className: "dialog-text" },
            "Zawartość kroniki, która jest teraz używana, zostanie utracona " +
            "i\u00A0nie będzie można jej później odzyskać."
          ),
          h("div", { className: "dialog-actions" },
            h("button", { onClick: closeOpenDialog }, "Anuluj"),
            h("button", { className: "danger", onClick: confirmOpen }, "Kontynuuj")
          )
        )
      ),
      // Ostrzeżenie przy zamykaniu programu (tylko gdy jest coś do stracenia).
      h("div", {
        className: "dialog-overlay" + (closeDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeCloseDialog();
          }
        }
      },
        h("div", { className: "dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Zamknąć program?"),
          h("div", { className: "dialog-text" },
            "Zawartość kroniki, która jest teraz używana, zostanie utracona " +
            "i\u00A0nie będzie można jej później odzyskać."
          ),
          h("div", { className: "dialog-actions" },
            h("button", { onClick: closeCloseDialog }, "Anuluj"),
            h("button", { className: "danger", onClick: confirmCloseApp }, "Zamknij")
          )
        )
      ),
      // Ostrzeżenie przed utworzeniem nowej kroniki (tylko gdy jest coś do stracenia).
      h("div", {
        className: "dialog-overlay" + (newDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeNewDialog();
          }
        }
      },
        h("div", { className: "dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Utworzyć nową kronikę?"),
          h("div", { className: "dialog-text" },
            "Obecna kronika zostanie zastąpiona nową, pustą. Jej zawartość, która nie jest " +
            "zapisana w\u00A0pliku, zostanie utracona i\u00A0nie będzie można jej później odzyskać."
          ),
          h("div", { className: "dialog-actions" },
            h("button", { onClick: closeNewDialog }, "Anuluj"),
            h("button", { className: "danger", onClick: confirmNew }, "Utwórz nową")
          )
        )
      ),
      // Okno jednej kropki niestandardowego układu. Zamyka się tylko przez
      // "Anuluj" albo kliknięcie poza nim.
      h("div", {
        className: "dialog-overlay" + (dotDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeDotDialog();
          }
        }
      },
        h("div", { className: "dialog dot-dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Dodaj kropkę"),
          h("div", { className: "dialog-text" },
            "Podaj odległości kropki od krawędzi strony. Wartości są w\u00A0jednostkach strony, " +
            `tych samych co rozmiary czcionek i\u00A0obrazów. Strona ma ${REF_PAGE_W}\u00A0j. ` +
			`szerokości i\u00A0${PAGE_H_UNITS}\u00A0j. wysokości.`
          ),
          h("div", { className: "dot-fields" },
            DOT_FIELDS.map(([f, label]) => h("label", { key: f, className: "dot-field" },
              label,
              h("input", {
                type: "text",
                inputMode: "numeric",
                maxLength: 3,
                spellCheck: false,
                autoComplete: "off",
                value: dotFields[f],
                onChange: (e) => onDotFieldChange(f, e.target.value),
                onBlur: () => onDotFieldBlur(f)
              })
            ))
          ),
          h("div", { className: "dialog-actions" },
            h("button", { onClick: closeDotDialog }, "Anuluj"),
            h("button", { className: "primary", onClick: confirmDot }, "Dodaj")
          )
        )
      ),
      // Okno "Usuń kropki": lista kropek, każda z przyciskiem usuwania.
      // Zamyka się tylko przez "Anuluj" albo kliknięcie poza nim.
      h("div", {
        className: "dialog-overlay" + (removeDotsDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeRemoveDotsDialog();
          }
        }
      },
        h("div", { className: "dialog remove-dots-dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Usuń kropki"),
          h("div", { className: "dialog-text" },
            "Poniżej są wszystkie kropki, które widać teraz na stronach, razem z\u00A0ich " +
            "odległościami od krawędzi strony (w\u00A0jednostkach strony). Kliknij kosz przy " +
            "kropce, aby od razu usunąć ją ze wszystkich stron."
          ),
          customDots.length
            ? h("div", { className: "dots-list" },
                customDots.map((p, i) => {
                  const left = Math.round(p.x * REF_PAGE_W), top = Math.round(p.y * PAGE_H_UNITS);
                  const cell = (label, v) => h("div", null,
                    h("span", { className: "dot-row-label" }, label), v + "\u00A0j.");
                  return h("div", { key: i + ":" + p.x + ":" + p.y, className: "dot-row" },
                    h("div", { className: "dot-row-values" },
                      cell("Lewy margines", left),
                      cell("Prawy margines", REF_PAGE_W - left),
                      cell("Górny margines", top),
                      cell("Dolny margines", PAGE_H_UNITS - top)
                    ),
                    h("div", {
                      className: "dots-btn",
                      "data-tip": "Usuń tę kropkę",
                      onClick: () => removeDot(i)
                    }, h(TrashIcon))
                  );
                })
              )
            : h("div", { className: "layouts-empty" }, "Na stronach nie ma żadnych kropek"),
          h("div", { className: "dialog-actions" },
            h("button", {
              className: "danger layouts-delete" + (customDots.length ? "" : " disabled"),
              onClick: removeAllDots
            }, "Usuń wszystkie"),
            h("button", { onClick: closeRemoveDotsDialog }, "Anuluj")
          )
        )
      ),
      // Okno z zapisanymi niestandardowymi układami. Zamyka się tylko przez
      // "Anuluj" albo kliknięcie poza nim.
      h("div", {
        className: "dialog-overlay" + (layoutsDialogOpen ? " visible" : ""),
        onMouseDown: (e) => {
          if (e.target === e.currentTarget) {
            e.preventDefault();
            closeLayoutsDialog();
          }
        }
      },
        h("div", { className: "dialog layouts-dialog", role: "dialog" },
          h("div", { className: "dialog-title" }, "Wybierz niestandardowy układ punktów"),
          savedLayouts.length
            ? h("div", { className: "layouts-grid" },
                savedLayouts.map((l, i) => h("div", {
                  key: i,
                  className: "layout-card" + (pickedLayout === i ? " selected" : ""),
                  onClick: () => setPickedLayout(i),
                  onDoubleClick: () => confirmPickedLayout(i)   // podwójne kliknięcie: od razu wybiera
                },
                  h(LayoutPageIcon, { dots: l.dots }),
                  h("div", { className: "layout-name" }, l.name)
                ))
              )
            : h("div", { className: "layouts-empty" }, "Brak zapisanych niestandardowych układów punktów"),
          h("div", { className: "dialog-actions" },
            h("button", {
              className: "danger layouts-delete" + (pickedLayout === null ? " disabled" : ""),
              onClick: deletePickedLayout
            }, "Usuń"),
            h("button", { onClick: closeLayoutsDialog }, "Anuluj"),
            h("button", {
              className: "primary" + (pickedLayout === null ? " disabled" : ""),
              onClick: () => confirmPickedLayout()
            }, "Wybierz")
          )
        )
      ),
      h("div", { className: "toast" + (toastVisible ? " visible" : "") + (toastQuick ? " quick" : "") }, toastText),
      colorPicker && h(ColorPicker, {
        key: colorPicker.boxId,
        anchor: colorPicker.anchor,
        current: colorPicker.current,
        onOk: (color) => {
          const apply = colorPicker.onApply;
          setColorPicker(null);
          apply(color);
        },
        onCancel: () => setColorPicker(null)
      })
    );
  }

  createRoot(document.getElementById("root")).render(h(App));
</script>
</body>
</html>
